# The category registry. Every question file names one of these ids.
#
# The set is deliberately weighted for an audience that is college-educated,
# widely traveled and often military — categories that reward a life of
# reading rather than recent pop culture.
#
# This used to end "nothing here requires knowledge of anything after about
# 1995". That line was retired when the 35-55 and 55-75 banks merged: a player
# at the older end of 35-75 was in their twenties in 1990, so the 1980s and
# 1990s are shared ground rather than someone else's era.

- id: history-20c
  name: The Twentieth Century
  blurb: The events your parents lived through and you watched unfold.
  sample: Treaties, elections, turning points

- id: military-history
  name: Military History
  blurb: Campaigns, commanders and the hardware.
  sample: From Verdun to Desert Storm

- id: geography
  name: World Geography
  blurb: Capitals, rivers, borders and the places in between.
  sample: Rivers, ranges and remote capitals

- id: literature
  name: Literature
  blurb: Novels, poets and first lines.
  sample: Authors, openings, prizes

- id: arts-classical
  name: Arts & Classical Music
  blurb: Painters, composers, architects and what they left behind.
  sample: Symphonies, canvases, cathedrals

- id: natural-world
  name: The Natural World
  blurb: Animals, plants, the earth itself and the weather over it.
  sample: Creatures, continents, climate

- id: physics-chemistry
  name: Physics & Chemistry
  blurb: Matter, energy, the elements and the laws they obey.
  sample: Elements, forces, constants

- id: medicine
  name: Medicine & The Body
  blurb: The body, and the people who worked out how it goes wrong.
  sample: Anatomy, discoveries, vaccines

- id: space-aviation
  name: Space & Aviation
  blurb: Apollo, aircraft and everything that leaves the ground.
  sample: Missions, machines, milestones

- id: business-economics
  name: Business & Economics
  blurb: Companies, brands, money and the people who moved it.
  sample: Founders, markets, logos

- id: world-affairs
  name: World Affairs
  blurb: Leaders, institutions and the Cold War's long shadow.
  sample: Summits, treaties, prime ministers

- id: film-tv
  name: Classic Film & Television
  blurb: The pictures and programs that defined four decades.
  sample: Oscars, casts, catchphrases

- id: music-popular
  name: Popular Music 1955-1995
  blurb: Motown through MTV.
  sample: Hits, bands, album covers

- id: sports
  name: Sports
  blurb: Records, dynasties and the moments everyone remembers.
  sample: Champions, streaks, upsets

- id: words-language
  name: Words & Language
  blurb: Etymology, usage and the odd corners of English.
  sample: Origins, meanings, phrases

- id: food-drink
  name: Food & Drink
  blurb: Regional cooking, wine and where it all comes from.
  sample: Grapes, cuts, provenance

- id: tiebreakers
  name: Tiebreakers
  blurb: Numeric sudden death. Closest answer wins.
  sample: Never used in a normal round

- id: us-places
  name: US States & Places
  blurb: States, capitals, borders and the landmarks between them.
  sample: Capitals, rivers, national parks

- id: stage-musicals
  name: Stage & Musicals
  blurb: Broadway, the West End and the straight play.
  sample: Scores, lyricists, first nights

- id: radio-comedy
  name: Radio & Comedy
  blurb: The golden age of radio, and the joke in every form it took after.
  sample: Serials, catchphrases, stand-up

- id: explorers
  name: Explorers & Voyages
  blurb: Expeditions, voyages and the people who did not come back.
  sample: Poles, passages, shipwrecks

- id: american-history
  name: American History
  blurb: The founding through to about 1900.
  sample: Colonies, the Constitution, the Civil War

- id: world-history
  name: World History
  blurb: Everything outside America, up to about 1900.
  sample: Empires, treaties, turning points

- id: invention-tech
  name: Invention & Technology
  blurb: What got built, and who got the credit instead.
  sample: Patents, firsts, happy accidents

- id: computers-internet
  name: Computers & The Internet
  blurb: The machines that got smaller and the network that joined them up.
  sample: Protocols, chips, the web

- id: consumer-electronics
  name: Consumer Electronics
  blurb: What ended up in the living room, the car and the pocket.
  sample: Formats, gadgets, the ones that lost

- id: transportation
  name: Transportation
  blurb: Road, rail and sea, and the people who laid them out.
  sample: Cars, locomotives, liners

