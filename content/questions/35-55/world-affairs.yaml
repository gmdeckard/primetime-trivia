category: world-affairs

questions:
  - id: a35-051
    difficulty: 2
    prompt: Which wall came down in 1989?
    answer: The Berlin Wall
    distractors: [Hadrian's Wall, The Great Wall, The Western Wall]
    fact: The opening was announced by an official reading a note he had not been briefed on, and the crowds simply arrived.

  - id: a35-052
    difficulty: 2
    prompt: Which country did Hong Kong return to in 1997?
    answer: China
    distractors: [Taiwan, Japan, Singapore]
    fact: The handover ended 156 years of British rule, and the lease that triggered it had been for ninety-nine years.

  - id: a35-053
    difficulty: 3
    prompt: Which country did the Soviet Union dissolve into fifteen of in 1991?
    answer: Independent republics
    distractors: [A single Russian federation, A confederation under Moscow, Two successor states]
    fact: The flag came down over the Kremlin on Christmas Day 1991, and the largest successor state kept the UN Security Council seat.

  - id: a35-054
    difficulty: 3
    prompt: Who was released from a South African prison in 1990 after twenty-seven years?
    answer: Nelson Mandela
    distractors: [Steve Biko, Desmond Tutu, Walter Sisulu]
    fact: Biko had died in custody thirteen years earlier. Sisulu was imprisoned alongside Mandela and released a few months before him.

  - id: a35-055
    difficulty: 3
    prompt: Which 1986 nuclear accident happened in what is now Ukraine?
    answer: Chernobyl
    distractors: [Three Mile Island, Fukushima, Windscale]
    fact: Swedish monitoring stations detected the fallout and raised the alarm before the Soviet government acknowledged anything.

  - id: a35-056
    difficulty: 3
    prompt: Which treaty created the European Union in 1993?
    answer: Maastricht
    distractors: [Rome, Lisbon, Nice]
    fact: Rome founded the earlier common market in 1957, and Lisbon reorganized the union in 2009, so all three are real and in order.

  - id: a35-057
    difficulty: 3
    prompt: Which country's apartheid system formally ended with elections in 1994?
    answer: South Africa
    distractors: [Zimbabwe, Namibia, Mozambique]
    fact: Queues at some polling stations ran for more than a mile, and voting had to be extended by an extra day.

  - id: a35-058
    difficulty: 4
    prompt: Which international agreement on reducing greenhouse gases was signed in 1997?
    answer: The Kyoto Protocol
    distractors: [The Montreal Protocol, The Rio Declaration, The Paris Agreement]
    fact: Montreal came first, in 1987, and dealt with the ozone layer. It is generally judged the more successful of the two.

  - id: a35-059
    difficulty: 4
    prompt: Which European currency union did Britain leave in 1992 on a day known as Black Wednesday?
    answer: The Exchange Rate Mechanism
    distractors: [The eurozone, The gold standard, The sterling area]
    fact: The Treasury spent billions in a single day defending the pound and then gave up by evening.

  - id: a35-060
    difficulty: 4
    prompt: Which country was divided by a 1995 agreement signed in Dayton, Ohio?
    answer: Bosnia and Herzegovina
    distractors: [Serbia, Croatia, Kosovo]
    fact: The talks were held on a US air force base specifically so the delegations could not leave or talk to the press.
