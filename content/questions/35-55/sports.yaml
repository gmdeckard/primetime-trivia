category: sports

questions:
  - id: a35-011
    difficulty: 2
    prompt: Which sport does the Super Bowl decide the champion of?
    answer: American football
    distractors: [Baseball, Basketball, Ice hockey]
    fact: The name came from a bouncy toy called a Super Ball that an owner's daughter was playing with.

  - id: a35-012
    difficulty: 2
    prompt: Which tennis player won Wimbledon eight times between 2003 and 2017?
    answer: Roger Federer
    distractors: [Rafael Nadal, Novak Djokovic, Pete Sampras]
    fact: Sampras won seven in the 1990s, and Federer beat his record in 2017 at nearly thirty-six.

  - id: a35-013
    difficulty: 3
    prompt: Which country hosted the 2008 Summer Olympics?
    answer: China
    distractors: [Greece, Britain, Brazil]
    fact: Athens had 2004, London 2012 and Rio 2016, so all three wrong answers held the games within eight years either side.

  - id: a35-014
    difficulty: 3
    prompt: Which soccer player scored the Hand of God goal in 1986?
    answer: Diego Maradona
    distractors: [Pele, Zico, Michel Platini]
    fact: He scored a second goal four minutes later, running past half the England team, that is often called the best in World Cup history.

  - id: a35-015
    difficulty: 3
    prompt: Which team broke an eighty-six-year championship drought in baseball in 2004?
    answer: The Boston Red Sox
    distractors: [The Chicago Cubs, The Chicago White Sox, The Cleveland Indians]
    fact: The Cubs waited even longer and finally won in 2016, which is why they are the tempting answer.

  - id: a35-016
    difficulty: 3
    prompt: Which cyclist was stripped of seven Tour de France titles?
    answer: Lance Armstrong
    distractors: [Miguel Indurain, Greg LeMond, Jan Ullrich]
    audience: 35-55   # the titles ran 1999 to 2005
    fact: Indurain won five in a row in the 1990s and kept them. The stripped years were simply left with no winner at all.

  - id: a35-017
    difficulty: 3
    prompt: In which sport did Tony Hawk land the first documented 900?
    answer: Skateboarding
    distractors: [Snowboarding, BMX, Freestyle motocross]
    fact: A 900 is two and a half full rotations. He landed it at the 1999 X Games after eleven failed attempts in a row.

  - id: a35-018
    difficulty: 4
    prompt: Which country won the first Rugby World Cup, in 1987?
    answer: New Zealand
    distractors: [Australia, South Africa, England]
    fact: South Africa were not invited, being under sporting boycott, and won the tournament the first time they entered in 1995.

  - id: a35-019
    difficulty: 4
    prompt: Which driver won seven Formula One world championships between 1994 and 2004?
    answer: Michael Schumacher
    distractors: [Ayrton Senna, Alain Prost, Mika Hakkinen]
    fact: Five of them came consecutively with Ferrari, who had not won a drivers' title for twenty-one years before he arrived.

  - id: a35-020
    difficulty: 4
    prompt: Which swimmer won eight gold medals at a single Olympic Games?
    answer: Michael Phelps
    distractors: [Mark Spitz, Ian Thorpe, Matt Biondi]
    fact: Beijing 2008. Spitz had held the record with seven since 1972, and was there to watch it broken.
