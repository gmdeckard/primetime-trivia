category: natural-world

# Animals, plants, the earth itself and the weather over it, plus how life
# turned out the way it did.

questions:
  - id: nat-001
    difficulty: 3
    prompt: Which scientist proposed the theory of continental drift in 1912?
    answer: Alfred Wegener
    distractors: [Charles Lyell, James Hutton, Harry Hess]
    fact: He was largely dismissed for decades because he could not explain a mechanism. Plate tectonics supplied one in the 1960s.
  - id: nat-002
    difficulty: 3
    prompt: What is the most abundant gas in the earth's atmosphere?
    answer: Nitrogen
    distractors: [Oxygen, Carbon dioxide, Argon]
    fact: About 78 per cent nitrogen to 21 per cent oxygen. Argon is third, at just under 1 per cent.
  - id: nat-003
    difficulty: 1
    prompt: What is the largest animal that has ever lived?
    answer: The blue whale
    distractors: [The African elephant, Argentinosaurus, The sperm whale]
    fact: Adults reach about 100 feet and 150 tons, heavier than any known dinosaur.
  - id: nat-004
    difficulty: 4
    prompt: What does DNA stand for?
    answer: Deoxyribonucleic acid
    distractors: [Diribonucleic acid, Deoxyribose nucleic amine, Dinucleic acid]
    fact: Watson and Crick published the double helix structure in 1953, drawing on Rosalind Franklin's X-ray diffraction work.
  - id: nat-005
    difficulty: 2
    prompt: Which gas do plants absorb from the air for photosynthesis?
    answer: Carbon dioxide
    distractors: [Oxygen, Nitrogen, Methane]
    fact: They release oxygen as a by-product, which is the reason the atmosphere has any to speak of.
  - id: nat-006
    difficulty: 3
    prompt: Which naturalist published "On the Origin of Species" in 1859?
    answer: Charles Darwin
    distractors: [Alfred Russel Wallace, Gregor Mendel, Jean-Baptiste Lamarck]
    fact: Wallace reached similar conclusions independently, which is what finally pushed Darwin to publish.
  - id: nat-007
    difficulty: 4
    prompt: What is the study of fungi called?
    answer: Mycology
    distractors: [Phycology, Bryology, Entomology]
    fact: Phycology is algae, bryology is mosses, entomology is insects.
  - id: nat-008
    difficulty: 2
    prompt: Which animal group do dolphins belong to?
    answer: Mammals
    distractors: [Fish, Reptiles, Amphibians]
    fact: They are warm-blooded, breathe air and nurse their young.
  - id: nat-009
    difficulty: 3
    prompt: Which tree is the tallest species on earth?
    answer: The coast redwood
    distractors: [The giant sequoia, The Douglas fir, The mountain ash]
    fact: Sequoia sempervirens exceeds 370 feet. The giant sequoia is more massive but not as tall.
  - id: nat-010
    difficulty: 2
    prompt: What causes the tides?
    answer: The gravitational pull of the moon and sun
    distractors: [The rotation of the earth alone, Prevailing winds, Variations in water temperature]
    fact: The moon dominates, but the sun's contribution produces the stronger spring tides when the two align.
  - id: nat-011
    difficulty: 4
    prompt: Which Austrian monk established the basic laws of heredity using pea plants?
    answer: Gregor Mendel
    distractors: [Charles Darwin, Thomas Hunt Morgan, Hugo de Vries]
    fact: His 1866 paper was almost entirely ignored until it was rediscovered around 1900.
  - id: nat-012
    difficulty: 3
    prompt: Which bird can fly backwards?
    answer: The hummingbird
    distractors: [The kingfisher, The swift, The kestrel]
    fact: Its wings trace a figure of eight, letting it hover and reverse — unique among birds.

  - id: nat-013
    difficulty: 2
    prompt: Which is the largest living bird?
    answer: The ostrich
    distractors: [The emu, The albatross, The condor]
    fact: The albatross beats it on wingspan, and the ostrich cannot fly at all, so largest depends on what you measure.

  - id: nat-014
    difficulty: 2
    prompt: What is a group of lions called?
    answer: A pride
    distractors: [A pack, A herd, A troop]
    fact: A troop is monkeys and a pack is wolves, so the wrong answers are all real collective nouns for the wrong animal.

  - id: nat-015
    difficulty: 3
    prompt: Which scale measures the energy released by an earthquake?
    answer: The Richter scale
    distractors: [The Beaufort scale, The Mercalli scale, The Saffir-Simpson scale]
    fact: Mercalli rates the damage you can see rather than the energy. Beaufort is wind and Saffir-Simpson is hurricanes.

  - id: nat-016
    difficulty: 3
    prompt: By which process do plants lose water through their leaves?
    answer: Transpiration
    distractors: [Respiration, Translocation, Osmosis]
    fact: A mature oak can move several hundred liters a day, which is most of what pulls water up the trunk in the first place.

  - id: nat-017
    difficulty: 3
    prompt: Which land animal has the longest pregnancy?
    answer: The elephant
    distractors: [The blue whale, The giraffe, The rhinoceros]
    fact: About 22 months. The calf can stand and walk within a couple of hours of being born.

  - id: nat-018
    difficulty: 3
    prompt: Which bird makes the longest annual migration?
    answer: The Arctic tern
    distractors: [The albatross, The bar-tailed godwit, The swallow]
    fact: Pole to pole and back every year. The godwit holds a different record, for the longest flight without landing.

  - id: nat-019
    difficulty: 3
    prompt: What causes the aurora borealis?
    answer: Charged particles from the sun hitting the atmosphere
    distractors: [Sunlight bending through ice crystals, Light reflecting off the polar ice, Electrical storms high in the atmosphere]
    fact: The color depends on which gas is struck and how high up. Oxygen gives the green, and the rarer red comes from much higher still.

  - id: nat-020
    difficulty: 3
    prompt: Which layer of the atmosphere holds most of the ozone?
    answer: The stratosphere
    distractors: [The troposphere, The mesosphere, The thermosphere]
    fact: Weather all happens in the troposphere below it, which is why airliners climb into the bottom of the stratosphere to get above it.

  - id: nat-021
    difficulty: 3
    prompt: Which rock type forms from cooled molten material?
    answer: Igneous
    distractors: [Sedimentary, Metamorphic, Conglomerate]
    fact: Metamorphic rock is any of the others changed by heat and pressure, and conglomerate is a kind of sedimentary rock.

  - id: nat-022
    difficulty: 4
    prompt: Which is the only mammal capable of true powered flight?
    answer: The bat
    distractors: [The flying squirrel, The colugo, The sugar glider]
    fact: All three wrong answers are real mammals that get about by air. Every one of them glides, and none can gain height.

  - id: nat-023
    difficulty: 4
    prompt: What is the study of tree rings called?
    answer: Dendrochronology
    distractors: [Palynology, Petrology, Dendrology]
    fact: Dendrology is trees in general and palynology is pollen. Rings can date a piece of timber to the exact year it was felled.

  - id: nat-024
    difficulty: 4
    prompt: In which geological era did the dinosaurs live?
    answer: The Mesozoic
    distractors: [The Paleozoic, The Cenozoic, The Precambrian]
    fact: The Cenozoic came after and is sometimes called the age of mammals, mostly by mammals.

  - id: nat-025
    difficulty: 4
    prompt: Which animal group contains starfish and sea urchins?
    answer: Echinoderms
    distractors: [Molluscs, Crustaceans, Cnidarians]
    fact: Cnidarians are the jellyfish and corals. Echinoderms are built around fivefold symmetry, which almost nothing else is.

  - id: nat-026
    difficulty: 4
    prompt: Which process do soil bacteria use to turn nitrogen from the air into a form plants can take up?
    answer: Nitrogen fixation
    distractors: [Transpiration, Photosynthesis, Respiration]
    fact: Legumes house the bacteria in nodules on their roots, which is why a field is sown with clover or beans to put the nitrogen back.
