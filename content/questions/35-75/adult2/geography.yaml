category: geography
pack:
  id: adult2
  name: Adult set 2

questions:
  - id: a2-geo-001
    difficulty: 2
    prompt: Which is the longest river in Africa?
    answer: The Nile
    distractors: [The Congo, The Niger, The Zambezi]
    fact: It drains eleven countries and is fed by two branches that meet at Khartoum. Which of it or the Amazon is the longest river on earth is still argued over.

  - id: a2-geo-002
    difficulty: 2
    prompt: Which is the highest mountain above sea level?
    answer: Mount Everest
    distractors: [K2, Kangchenjunga, Mount McKinley]
    fact: It grows about a quarter inch a year as India pushes into Asia, and it moves northeast at a similar rate.

  - id: a2-geo-003
    difficulty: 2
    prompt: What is the capital of Canada?
    answer: Ottawa
    distractors: [Toronto, Montreal, Vancouver]
    fact: Queen Victoria settled on it as a compromise between the English and French candidates, and because it was far enough from the American border to be defensible.

  - id: a2-geo-004
    difficulty: 2
    prompt: What is the capital of Egypt?
    answer: Cairo
    distractors: [Alexandria, Luxor, Giza]
    fact: It is the largest city in the Arab world, built where the river fans out into its delta, and its medieval quarter has more standing Islamic monuments than anywhere else.

  - id: a2-geo-005
    difficulty: 2
    prompt: What is the capital of Argentina?
    answer: Buenos Aires
    distractors: [Cordoba, Rosario, Montevideo]
    fact: Its people are called portenos, people of the port. More of them claim Italian descent than Spanish.

  - id: a2-geo-006
    difficulty: 2
    prompt: On which continent is the Amazon rainforest?
    answer: South America
    distractors: [Africa, Asia, Australia]
    fact: It covers about a third of the continent across nine countries. Roughly a fifth of it has been cleared since 1970.

  - id: a2-geo-007
    difficulty: 2
    prompt: What is the capital of Japan?
    answer: Tokyo
    distractors: [Kyoto, Osaka, Nagoya]
    fact: It was called Edo until 1868 and the name means eastern capital. The old capital, Kyoto, has a name made of the same two characters reversed.

  - id: a2-geo-008
    difficulty: 3
    prompt: Which is the highest capital city in the world?
    answer: La Paz
    distractors: [Quito, Bogota, Kathmandu]
    fact: Over eleven thousand feet, high enough that visitors are told to do nothing for a day. It is Bolivia's seat of government rather than its constitutional capital, which is Sucre. Fires burn poorly and the airport has one of the longest runways anywhere.

  - id: a2-geo-009
    difficulty: 3
    prompt: Which two countries share the island of Hispaniola?
    answer: Haiti and the Dominican Republic
    distractors: [Cuba and Jamaica, Haiti and Puerto Rico, Trinidad and Tobago]
    fact: One speaks French and Creole, the other Spanish, and the forest cover on either side of the border is visibly different from the air.

  - id: a2-geo-010
    difficulty: 3
    prompt: Which country has the longest border with Brazil?
    answer: Bolivia
    distractors: [Argentina, Peru, Venezuela]
    fact: Over two thousand miles of it, most through forest and wetland with no road crossing for hundreds of miles at a stretch.

  - id: a2-geo-011
    difficulty: 3
    prompt: Which sea lies between Italy and the Balkan coast?
    answer: The Adriatic
    distractors: [The Ionian, The Tyrrhenian, The Aegean]
    fact: Venice built an empire on its trade and threw a ring into it every year to marry the city to the water.

  - id: a2-geo-012
    difficulty: 3
    prompt: Which mountain range runs down the western side of South America?
    answer: The Andes
    distractors: [The Sierra Madre, The Guiana Highlands, The Brazilian Shield]
    fact: Over four thousand miles long, the longest continental range there is. It holds the highest volcanoes and the highest navigable lake.

  - id: a2-geo-013
    difficulty: 3
    prompt: The Gobi Desert lies in China and which other country?
    answer: Mongolia
    distractors: [Kazakhstan, Nepal, Kyrgyzstan]
    fact: It is a cold desert where temperatures swing more than a hundred degrees across the year, and it is growing south toward Beijing.

  - id: a2-geo-014
    difficulty: 3
    prompt: Which is the largest inland body of water on earth?
    answer: The Caspian Sea
    distractors: [Lake Michigan, The Black Sea, Lake Tanganyika]
    fact: Whether it counts as a sea or a lake decides who owns the oil beneath it, so five countries argued about the word for decades.

  - id: a2-geo-015
    difficulty: 3
    prompt: Which island off the southeast coast of Africa is the fourth largest in the world?
    answer: Madagascar
    distractors: [Sri Lanka, Zanzibar, Socotra]
    fact: It broke away from the mainland about eighty-eight million years ago, so most of what lives there lives nowhere else, lemurs included.

  - id: a2-geo-016
    difficulty: 3
    prompt: Which is the largest country in South America?
    answer: Brazil
    distractors: [Argentina, Peru, Colombia]
    fact: It takes up nearly half the continent and borders every country on it but two. It is the only one there where Portuguese is spoken.

  - id: a2-geo-017
    difficulty: 3
    prompt: Which river flows through Paris?
    answer: The Seine
    distractors: [The Loire, The Rhone, The Marne]
    fact: The city began on an island in it. Paris house numbers run in the direction the water flows, which is why the system looks arbitrary until you know.

  - id: a2-geo-018
    difficulty: 3
    prompt: Which body of water sits at the lowest land elevation on earth?
    answer: The Dead Sea
    distractors: [The Caspian Depression, Lake Assal, The Qattara Depression]
    fact: Over fourteen hundred feet below sea level and dropping about three feet a year, because the river that fed it is almost entirely taken for drinking and farming.

  - id: a2-geo-019
    difficulty: 3
    prompt: What is the capital of Brazil?
    answer: Brasilia
    distractors: [Rio de Janeiro, Sao Paulo, Salvador]
    fact: It was built from nothing in forty-one months on empty plateau, laid out in the shape of an aircraft, and opened in 1960 to move the country's center inland.

  - id: a2-geo-020
    difficulty: 3
    prompt: Which is the largest island in the world?
    answer: Greenland
    distractors: [New Guinea, Borneo, Baffin Island]
    fact: Three times the size of Texas with about fifty-six thousand people. Mercator maps make it look the size of Africa, which is fourteen times larger.

  - id: a2-geo-021
    difficulty: 3
    prompt: What is the capital of Turkey?
    answer: Ankara
    distractors: [Izmir, Bursa, Antalya]
    fact: It was a provincial town of thirty thousand when the new republic chose it in 1923, inland and defensible, over the old imperial capital on the water.

  - id: a2-geo-022
    difficulty: 3
    prompt: Which African country has the largest population?
    answer: Nigeria
    distractors: [Egypt, Ethiopia, Congo]
    fact: Over two hundred million people and more than five hundred languages. Lagos alone is bigger than most countries on the continent.

  - id: a2-geo-023
    difficulty: 3
    prompt: Which canal lets ships cut from the North Sea to the Baltic?
    answer: The Kiel Canal
    distractors: [The Gota Canal, The White Sea Canal, The Rhine-Main-Danube Canal]
    fact: It saves about two hundred and fifty miles around Denmark and is the busiest artificial waterway in the world by number of ships.

  - id: a2-geo-024
    difficulty: 3
    prompt: Which mountain range runs down the spine of Italy?
    answer: The Apennines
    distractors: [The Dolomites, The Carpathians, The Dinaric Alps]
    fact: They are young, soft and slipping, which is why the country has so many landslides and why its hill towns sit where they do.

  - id: a2-geo-025
    difficulty: 3
    prompt: Which is the longest river in Asia?
    answer: The Yangtze
    distractors: [The Yellow River, The Mekong, The Ob]
    fact: Nearly four thousand miles, and the only river wholly within one country among the world's longest. A third of China's people live in its basin.

  - id: a2-geo-026
    difficulty: 4
    prompt: Which US state lies closest to Africa?
    answer: Maine
    distractors: [Florida, South Carolina, Massachusetts]
    fact: The eastern bulge of Brazil is closer to Africa than anything in North America, but among the states the northeastern corner wins by a few hundred miles.

  - id: a2-geo-027
    difficulty: 4
    prompt: Which African country has Spanish as an official language?
    answer: Equatorial Guinea
    distractors: [Western Sahara, Morocco, Angola]
    fact: It was a Spanish colony until 1968 and is the only one on the continent. Its oil gives it one of Africa's highest incomes per head and almost none of it reaches the people.

  - id: a2-geo-028
    difficulty: 4
    prompt: Which mountain is the tallest on earth measured from its own base?
    answer: Mauna Kea
    distractors: [Denali, Chimborazo, Mount Fuji]
    fact: Over thirty-three thousand feet from the seafloor, with only about a third of it above water. Its summit holds the world's largest cluster of big telescopes.

  - id: a2-geo-029
    difficulty: 4
    prompt: Iguazu Falls pour into which far larger river a few miles downstream?
    answer: The Parana
    distractors: [The Uruguay, The Paraguay, The Negro]
    fact: The falls themselves are on the Iguazu, a tributary. They run nearly two miles of cliff in two hundred and seventy separate drops, and a dam below the junction was for years the largest producer of hydroelectricity on earth.

  - id: a2-geo-030
    difficulty: 4
    prompt: Which is the largest country with no permanent rivers?
    answer: Saudi Arabia
    distractors: [Libya, Mongolia, Niger]
    fact: Its water comes from desalination and from aquifers filled during the last ice age. It is the world's biggest producer of fresh water from the sea.

  - id: a2-geo-031
    difficulty: 4
    prompt: Which two countries are doubly landlocked, surrounded only by landlocked neighbors?
    answer: Liechtenstein and Uzbekistan
    distractors: [Nepal and Bolivia, Austria and Paraguay, Bhutan and Mongolia]
    fact: Uzbekistan borders the Caspian's neighbors but not the sea. Liechtenstein is ringed by Switzerland and Austria, both landlocked themselves.

  - id: a2-geo-032
    difficulty: 4
    prompt: Which country's name comes from the Arabic for land of the blacks?
    answer: Sudan
    distractors: [Chad, Mali, Niger]
    fact: The term covered the whole belt south of the desert. The country split in two in 2011 after a civil war of more than twenty years.

  - id: a2-geo-033
    difficulty: 4
    prompt: Which is the largest river delta in the world?
    answer: The Ganges-Brahmaputra
    distractors: [The Nile delta, The Mississippi delta, The Mekong delta]
    fact: Around a hundred and thirty million people live on it, much of it less than thirty feet above the sea, which makes a storm surge there among the deadliest events on earth.

  - id: a2-geo-034
    difficulty: 4
    prompt: Which strait carries more cargo tonnage than any other in the world?
    answer: The Strait of Malacca
    distractors: [The Strait of Hormuz, The English Channel, The Bab-el-Mandeb]
    fact: About a quarter of all traded goods pass through it, and at its narrowest it is under two miles wide, which has kept piracy in business there for centuries.

  - id: a2-geo-035
    difficulty: 4
    prompt: Which is the northernmost capital of a sovereign country?
    answer: Reykjavik
    distractors: [Helsinki, Oslo, Nuuk]
    fact: It sits just under the Arctic Circle and is heated almost entirely by geothermal water piped from the ground, which is why the city has no smoke. Nuuk lies further north but governs a territory rather than a country.

  - id: a2-geo-036
    difficulty: 2
    prompt: Which gulf lies between Iran and the Arabian peninsula?
    answer: The Persian Gulf
    distractors: [The Gulf of Oman, The Gulf of Aden, The Red Sea]
    fact: It is shallow, rarely more than two hundred feet, and very warm and salty. A third of the world's seaborne oil leaves through the strait at its mouth.

  - id: a2-geo-037
    difficulty: 2
    prompt: What is the capital of Russia?
    answer: Moscow
    distractors: [St Petersburg, Novosibirsk, Kazan]
    fact: It has been the capital twice, losing the job to a new city on the Baltic for two centuries and getting it back in 1918.

  - id: a2-geo-038
    difficulty: 2
    prompt: Which country lies directly south of the United States?
    answer: Mexico
    distractors: [Guatemala, Cuba, Belize]
    fact: Its formal name is the United Mexican States, and it has thirty-two of them. The border between the two countries runs nineteen hundred miles.

  - id: a2-geo-039
    difficulty: 2
    prompt: Which continent lies almost entirely in the southern hemisphere and is also a country?
    answer: Australia
    distractors: [Antarctica, Africa, South America]
    fact: It is the flattest and driest inhabited continent, and its highest point is lower than the tallest building people have since built.

  - id: a2-geo-040
    difficulty: 2
    prompt: Which mountain range separates India from Tibet?
    answer: The Himalayas
    distractors: [The Karakoram alone, The Hindu Kush, The Tian Shan]
    fact: The name means abode of snow. All fourteen of the world's peaks above eight thousand meters are in it or the ranges immediately beside it.

  - id: a2-geo-041
    difficulty: 2
    prompt: Which is the smallest and shallowest ocean?
    answer: The Arctic
    distractors: [The Southern, The Indian, The Atlantic]
    fact: It is about one and a half times the size of the United States and ringed by shallow continental shelf, which is why so much of it freezes.

  - id: a2-geo-042
    difficulty: 3
    prompt: Which African country is divided by the Great Rift Valley and sits on the equator?
    answer: Kenya
    distractors: [Sudan, Zambia, Angola]
    fact: The valley is a continent tearing apart at about the speed a fingernail grows. In a few million years the eastern strip will be an island.

  - id: a2-geo-043
    difficulty: 3
    prompt: Which European country has the most land below sea level?
    answer: The Netherlands
    distractors: [Belgium, Denmark, Poland]
    fact: About a quarter of it, protected by dikes and pumped dry for centuries, first by windmills and now by diesel. The lowest point is twenty-two feet down.

  - id: a2-geo-044
    difficulty: 3
    prompt: Which strait separates Denmark from Sweden?
    answer: The Oresund
    distractors: [The Kattegat, The Skagerrak, The Great Belt]
    fact: Under two and a half miles at its narrowest. A bridge and tunnel have carried road and rail across it since 2000.

  - id: a2-geo-045
    difficulty: 3
    prompt: Which country has three capital cities?
    answer: South Africa
    distractors: [Bolivia, Malaysia, Sri Lanka]
    fact: The executive, the legislature and the courts sit in three different cities, a compromise struck in 1910 so no province felt cheated.

  - id: a2-geo-046
    difficulty: 3
    prompt: Which country spans eleven time zones?
    answer: Russia
    distractors: [The United States, China, Kazakhstan]
    fact: They run from the Baltic to the Bering Strait. China is wide enough for five and keeps every clock in the country on Beijing time anyway.

  - id: a2-geo-047
    difficulty: 3
    prompt: Which is the largest country in Africa by area?
    answer: Algeria
    distractors: [Libya, Chad, Egypt]
    fact: It took the title in 2011 when its southern neighbor split in two. Nine tenths of it is desert and almost everyone lives on the coastal strip.

  - id: a2-geo-048
    difficulty: 3
    prompt: Which line of latitude marks the northern edge of the tropics?
    answer: The Tropic of Cancer
    distractors: [The Tropic of Capricorn, The Arctic Circle, The Prime Meridian]
    fact: It marks the furthest north the sun is ever directly overhead. It moves slightly each year as the earth's tilt wobbles.

  - id: a2-geo-049
    difficulty: 3
    prompt: Which country surrounds the small kingdom of Bhutan on three sides?
    answer: India
    distractors: [China, Nepal, Bangladesh]
    fact: Its remaining border is with Tibet and has been closed for decades. The country measures its progress by a published index of national happiness.

  - id: a2-geo-050
    difficulty: 3
    prompt: Which peninsula do Spain and Portugal share?
    answer: The Iberian
    distractors: [The Balkan, The Apennine, The Anatolian]
    fact: It is cut off from the rest of Europe by a mountain wall, which is why Napoleon called the continent's politics a different matter beyond it.

  - id: a2-geo-051
    difficulty: 3
    prompt: Which American state is closest to Russia?
    answer: Alaska
    distractors: [Washington, Hawaii, Maine]
    fact: Two islands in the strait between them are American and Russian and lie two and a half miles apart, with the date line running between.

  - id: a2-geo-052
    difficulty: 3
    prompt: Which sea is enclosed by Russia, Ukraine, Turkey, Bulgaria, Romania and Georgia?
    answer: The Black Sea
    distractors: [The Caspian, The Baltic, The Aegean]
    fact: Below about five hundred feet it has no oxygen at all, so nothing lives down there and wooden shipwrecks survive almost intact.

  - id: a2-geo-053
    difficulty: 3
    prompt: Which European capital stands on the Vistula?
    answer: Warsaw
    distractors: [Budapest, Riga, Vilnius]
    fact: Something like eighty-five percent of it was deliberately destroyed in 1944. The old town was rebuilt from paintings and photographs and is now a heritage site for that reason.

  - id: a2-geo-054
    difficulty: 3
    prompt: Which country owns the Galapagos Islands?
    answer: Ecuador
    distractors: [Peru, Chile, Colombia]
    fact: They sit about six hundred miles offshore. The currents that meet there bring cold water to the equator, which is why penguins live alongside tropical fish.

  - id: a2-geo-055
    difficulty: 3
    prompt: Which is the longest mountain range in Europe?
    answer: The Scandinavian Mountains
    distractors: [The Alps, The Carpathians, The Caucasus]
    fact: About a thousand miles down the spine of Norway and Sweden. They are the worn-down roots of a range that was once as high as any on earth.

  - id: a2-geo-056
    difficulty: 3
    prompt: Which desert covers most of Botswana and parts of Namibia and South Africa?
    answer: The Kalahari
    distractors: [The Namib, The Karoo, The Danakil]
    fact: It is a sand basin rather than a true desert, since enough rain falls for grass and trees. A river empties into its northern edge and never reaches the sea.

  - id: a2-geo-057
    difficulty: 4
    prompt: Which country has the most World Heritage sites?
    answer: Italy
    distractors: [China, Spain, France]
    fact: Around sixty of them, with China a site or two behind. The list has been running since 1978 and now covers over a thousand places.

  - id: a2-geo-058
    difficulty: 4
    prompt: What is an exclave?
    answer: Part of a country cut off by other countries' territory
    distractors: [A territory with no permanent residents, A region governed jointly by two states, A disputed border zone]
    fact: Kaliningrad is the best-known example in Europe. The Indian and Bangladeshi border once held over a hundred of them, including one inside another inside another.

  - id: a2-geo-059
    difficulty: 4
    prompt: Which country is divided into cantons?
    answer: Switzerland
    distractors: [Austria, Belgium, Luxembourg]
    fact: There are twenty-six, some of them smaller than a city, and each sets its own taxes and schooling. A few still vote by show of hands in an open square.

  - id: a2-geo-060
    difficulty: 4
    prompt: Which African lake is the second deepest in the world?
    answer: Lake Tanganyika
    distractors: [Lake Malawi, Lake Turkana, Lake Chad]
    fact: Nearly a mile deep and shared by four countries. Like the deep sea, its lower layers hold no oxygen, so everything alive is in the top few hundred feet.

  - id: a2-geo-061
    difficulty: 4
    prompt: Which island was known to Europeans as Formosa?
    answer: Taiwan
    distractors: [Sri Lanka, Hainan, Okinawa]
    fact: The name is Portuguese for beautiful. The Dutch and then the Spanish held parts of it in the seventeenth century before a Ming loyalist drove them out.

  - id: a2-geo-062
    difficulty: 4
    prompt: Which capital city sits highest in Europe?
    answer: Andorra la Vella
    distractors: [Bern, Vaduz, Ljubljana]
    fact: About thirty-four hundred feet in a valley in the Pyrenees. The country has two heads of state, one of them a French president and the other a Spanish bishop.

  - id: a2-geo-063
    difficulty: 4
    prompt: Which sea's level has dropped so far that ships lie stranded in sand?
    answer: The Aral
    distractors: [The Dead Sea, The Caspian, Lake Chad]
    fact: Soviet planners diverted both feeder rivers to cotton in the 1960s knowing this would happen, and judged the cotton worth more.

  - id: a2-geo-064
    difficulty: 4
    prompt: Which country is the only one to border both Haiti and no other state?
    answer: The Dominican Republic
    distractors: [Cuba, Jamaica, The Bahamas]
    fact: Two countries on one island and nothing else touching either. The border was settled by treaty in 1929 and adjusted again in 1936.

  - id: a2-geo-065
    difficulty: 4
    prompt: What does a fjord's shape tell you about how it formed?
    answer: It was carved by a glacier and then flooded by the sea
    distractors: [It was cut by a river and widened by tides, It is a sunken fault line, It is a drowned volcanic crater]
    fact: The floor is often deeper inside than at the mouth, where the ice dropped its load of rubble. That sill is why the deep water inside can go stagnant.
