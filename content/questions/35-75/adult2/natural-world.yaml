category: natural-world
pack:
  id: adult2
  name: Adult set 2

questions:
  - id: a2-nat-001
    difficulty: 2
    prompt: Which is the largest of the big cats?
    answer: The tiger
    distractors: [The lion, The jaguar, The leopard]
    fact: A large male runs to about six hundred pounds. More of them live in captivity in the United States than remain in the wild anywhere.

  - id: a2-nat-002
    difficulty: 2
    prompt: Which is the fastest land animal over a short distance?
    answer: The cheetah
    distractors: [The pronghorn, The lion, The greyhound]
    fact: It can hit about seventy miles an hour but overheats within half a minute. The pronghorn is slower and can hold its pace for miles.

  - id: a2-nat-003
    difficulty: 2
    prompt: What is an animal that eats only plants called?
    answer: A herbivore
    distractors: [A carnivore, An omnivore, A detritivore]
    fact: Almost none of them digest cellulose themselves. The work is done by bacteria in the gut, which is why a cow has four stomach compartments.

  - id: a2-nat-004
    difficulty: 2
    prompt: Which sea creature has eight arms?
    answer: The octopus
    distractors: [The squid, The cuttlefish, The nautilus]
    fact: Squid and cuttlefish have eight arms plus two longer tentacles. An octopus has three hearts and blue blood, and most of its neurons are in its arms.

  - id: a2-nat-005
    difficulty: 2
    prompt: What kind of animal is a Komodo dragon?
    answer: A lizard
    distractors: [A crocodile, A salamander, A snake]
    fact: It is the heaviest lizard alive, reaching about one hundred and fifty pounds, and it was unknown to science until 1910.

  - id: a2-nat-006
    difficulty: 2
    prompt: What is a baby kangaroo called?
    answer: A joey
    distractors: [A kit, A cub, A calf]
    fact: It is born about the size of a jellybean after a month, crawls unaided to the pouch, and stays there for the better part of a year.

  - id: a2-nat-007
    difficulty: 2
    prompt: Which is the largest living reptile?
    answer: The saltwater crocodile
    distractors: [The Nile crocodile, The American alligator, The leatherback turtle]
    fact: A big male runs over a ton and twenty feet. They swim far out to sea, which is how they reached islands across the Pacific.

  - id: a2-nat-008
    difficulty: 3
    prompt: Which is the deepest known trench in the ocean?
    answer: The Mariana Trench
    distractors: [The Tonga Trench, The Java Trench, The Puerto Rico Trench]
    fact: Nearly seven miles down, where the pressure is over a thousand times what it is at the surface. Three crewed descents have reached the bottom.

  - id: a2-nat-009
    difficulty: 3
    prompt: Which is the largest species of shark?
    answer: The whale shark
    distractors: [The great white, The basking shark, The tiger shark]
    fact: It reaches forty feet and lives on plankton and small fish, filtering water through its gills. Its skin pattern is unique to each animal, like a fingerprint.

  - id: a2-nat-010
    difficulty: 3
    prompt: Which animal has the largest eye of any living creature?
    answer: The giant squid
    distractors: [The blue whale, The elephant seal, The swordfish]
    fact: Nearly a foot across, probably to spot the approach of a sperm whale in near darkness. No one photographed a live one until 2004.

  - id: a2-nat-011
    difficulty: 3
    prompt: What is a rhinoceros horn made of?
    answer: Keratin
    distractors: [Bone, Ivory, Cartilage]
    fact: The same protein as hair and fingernails, with no bone core at all. It is worth more by weight than gold in some markets, which is why the animals are nearly gone.

  - id: a2-nat-012
    difficulty: 3
    prompt: Which mammal lays eggs?
    answer: The platypus
    distractors: [The sloth, The armadillo, The pangolin]
    fact: The first specimen sent to England was taken for a hoax stitched together from other animals. The males also carry venom in a spur on the hind leg.

  - id: a2-nat-013
    difficulty: 3
    prompt: Which is the largest species of penguin?
    answer: The emperor penguin
    distractors: [The king penguin, The gentoo, The Adelie]
    fact: The males incubate the single egg on their feet through the Antarctic winter, going without food for about four months.

  - id: a2-nat-014
    difficulty: 3
    prompt: What is the process by which a liquid becomes a gas at its surface without boiling?
    answer: Evaporation
    distractors: [Condensation, Sublimation, Precipitation]
    fact: It takes heat with it, which is why sweating cools you and why a wet towel in a breeze feels cold.

  - id: a2-nat-015
    difficulty: 3
    prompt: What does the Mohs scale measure?
    answer: The hardness of minerals
    distractors: [The density of rock, The acidity of soil, The magnetism of ore]
    fact: 'It is just an order, not a measurement: each mineral scratches the one below. A geologist in the field used a fingernail, a coin and a steel knife.'

  - id: a2-nat-016
    difficulty: 3
    prompt: Which group of living things has no nucleus in its cells?
    answer: Bacteria
    distractors: [Fungi, Algae, Protozoa]
    fact: Their DNA floats loose in the cell. One person's gut holds about as many of them as there are human cells in the entire body, a shade more by the best current count.

  - id: a2-nat-017
    difficulty: 3
    prompt: Which scale rates the strength of a hurricane?
    answer: The Saffir-Simpson scale
    distractors: [The Beaufort scale, The Fujita scale, The Palmer index]
    fact: It runs one to five on sustained wind speed alone, so it says nothing about rainfall or storm surge, which do most of the killing.

  - id: a2-nat-018
    difficulty: 3
    prompt: Which winds blow steadily toward the equator from the east?
    answer: The trade winds
    distractors: [The westerlies, The monsoon winds, The jet stream]
    fact: Sailing ships rode them west and came home on the westerlies further north. The belt of calm between the two was the sailor's dread.

  - id: a2-nat-019
    difficulty: 3
    prompt: Which tree produces acorns?
    answer: The oak
    distractors: [The beech, The elm, The sycamore]
    fact: A mature tree can drop ten thousand in a good year and almost nothing in a poor one, which keeps the animals that eat them from building up numbers.

  - id: a2-nat-020
    difficulty: 3
    prompt: Beetles belong to which insect order?
    answer: Coleoptera
    distractors: [Hymenoptera, Lepidoptera, Diptera]
    fact: About one in four known animal species is a beetle. Asked what his studies told him of the creator, one biologist said he must have an inordinate fondness for them.

  - id: a2-nat-021
    difficulty: 3
    prompt: Which flightless bird of Mauritius was extinct within a century of being found?
    answer: The dodo
    distractors: [The great auk, The moa, The passenger pigeon]
    fact: Sailors ate some, but the pigs, rats and monkeys they landed did most of the work. No complete specimen survives anywhere.

  - id: a2-nat-022
    difficulty: 3
    prompt: What is the word for an animal active mainly at dawn and dusk?
    answer: Crepuscular
    distractors: [Nocturnal, Diurnal, Vespertine]
    fact: Deer, rabbits and most cats fall in this group. The light is poor enough to hide in and good enough to hunt by.

  - id: a2-nat-023
    difficulty: 3
    prompt: What does a bird's preen gland supply?
    answer: Oil to waterproof the feathers
    distractors: [Grit for the gizzard, Calcium for eggshells, Scent for marking territory]
    fact: It sits at the base of the tail and the bird spreads the oil with its beak. A detergent spill strips it, which is why oiled birds drown or freeze.

  - id: a2-nat-024
    difficulty: 3
    prompt: What is a plant called that germinates, flowers and dies within one year?
    answer: An annual
    distractors: [A perennial, A biennial, An ephemeral]
    fact: Almost every grain crop is one, which is why a field has to be sown again every season. A biennial flowers in its second year and then dies.

  - id: a2-nat-025
    difficulty: 3
    prompt: Which bird reaches the highest speed of any animal, in a dive?
    answer: The peregrine falcon
    distractors: [The golden eagle, The frigatebird, The swift]
    fact: Over two hundred miles an hour, with bony tubercles in the nostrils to keep the airflow from stopping its breathing.

  - id: a2-nat-026
    difficulty: 4
    prompt: What is the boundary between the earth's crust and mantle called?
    answer: The Moho
    distractors: [The Gutenberg discontinuity, The Lehmann boundary, The Conrad layer]
    fact: A Croatian seismologist found it in 1909 because earthquake waves speed up abruptly when they cross it. No drill has ever reached it.

  - id: a2-nat-027
    difficulty: 4
    prompt: What is permafrost?
    answer: Ground that stays frozen for two years or more
    distractors: [A layer of ice over a river in winter, Soil that never thaws below its surface crust, Frost that forms on glacier faces]
    fact: It covers about a quarter of the northern hemisphere's land. Thawing it releases methane that was locked up long before there were people.

  - id: a2-nat-028
    difficulty: 4
    prompt: Which mass extinction, about 252 million years ago, killed the largest share of life?
    answer: The end-Permian
    distractors: [The end-Cretaceous, The late Devonian, The end-Triassic]
    fact: Something like nine in ten marine species went. The likeliest culprit is a vast volcanic province in Siberia that burned through coal beds.

  - id: a2-nat-029
    difficulty: 4
    prompt: What kind of organism covers more ground than any other single living thing yet found?
    answer: A fungus
    distractors: [A tree, A coral, A seagrass]
    fact: One honey fungus in Oregon spreads over three and a half square miles of forest floor and may be thousands of years old. Almost all of it is underground.

  - id: a2-nat-030
    difficulty: 4
    prompt: Which ocean current carries warm water from the Gulf of Mexico toward Europe?
    answer: The Gulf Stream
    distractors: [The Canary Current, The Labrador Current, The North Equatorial Current]
    fact: Benjamin Franklin had it charted to speed up the mail packets. Its warmth, carried the last stretch by the prevailing westerly winds, is a good part of why Britain is mild at the latitude of Labrador.

  - id: a2-nat-031
    difficulty: 4
    prompt: What is the thermocline in a body of water?
    answer: The depth at which temperature drops sharply
    distractors: [The depth sunlight stops reaching, The layer where salinity changes, The level of maximum pressure]
    fact: It reflects sound, which is how a submarine hides beneath it. Fish stack up along it too, which anglers with sonar look for.

  - id: a2-nat-032
    difficulty: 4
    prompt: Which bird leaves its egg in another species' nest to be raised?
    answer: The cuckoo
    distractors: [The shrike, The jay, The nightjar]
    fact: The chick hatches early and shoves the host's own eggs over the side. Some hosts have learned to spot the fraud, and those cuckoos have had to improve their forgeries.

  - id: a2-nat-033
    difficulty: 4
    prompt: Which naturalist reached the idea of natural selection independently and forced its publication?
    answer: Alfred Russel Wallace
    distractors: [Thomas Huxley, Joseph Hooker, Charles Lyell]
    fact: He sent his paper from the Malay Archipelago to a man who had sat on the same conclusion for twenty years. They read jointly to the Linnean Society in 1858.

  - id: a2-nat-034
    difficulty: 4
    prompt: What are the white cliffs of Dover made of?
    answer: Chalk
    distractors: [Limestone, Gypsum, Marble]
    fact: It is the compressed shells of microscopic algae that lived in a warm sea about ninety million years ago, laid down at roughly an inch a century.

  - id: a2-nat-035
    difficulty: 4
    prompt: Which element makes up the largest share of the earth's crust by weight?
    answer: Oxygen
    distractors: [Silicon, Iron, Aluminum]
    fact: Nearly half, locked into silicate minerals rather than floating free. Silicon is second, and the two together are most of the rock underfoot.

  - id: a2-nat-036
    difficulty: 2
    prompt: Which sense is a dog's sharpest?
    answer: Smell
    distractors: [Hearing, Sight, Taste]
    fact: It has something like three hundred million scent receptors to a person's six million, and a second organ in the roof of the mouth for heavy molecules.

  - id: a2-nat-037
    difficulty: 2
    prompt: What do bees collect from flowers to make honey?
    answer: Nectar
    distractors: [Pollen, Sap, Resin]
    fact: It takes about two million flower visits to make a pound of it. Pollen is collected too, but as protein for the young rather than for honey.

  - id: a2-nat-038
    difficulty: 2
    prompt: Which is the largest species of bear?
    answer: The polar bear
    distractors: [The grizzly, The black bear, The giant panda]
    fact: A big male stands ten feet on its hind legs. Its skin underneath is black, and the hairs are hollow and colorless rather than white.

  - id: a2-nat-039
    difficulty: 2
    prompt: Which animal is the tallest living species?
    answer: The giraffe
    distractors: [The elephant, The moose, The camel]
    fact: Its neck holds seven vertebrae, the same number as a person's, each one about ten inches long. Its heart weighs around twenty-five pounds to push blood that high.

  - id: a2-nat-040
    difficulty: 2
    prompt: What is the center of a hurricane called?
    answer: The eye
    distractors: [The core, The vortex, The well]
    fact: It is calm and often clear, ringed by the wall where the worst winds are. People caught in it have walked outside believing the storm had passed.

  - id: a2-nat-041
    difficulty: 2
    prompt: Which part of a tree carries water from the roots to the leaves?
    answer: The xylem
    distractors: [The phloem, The bark, The cambium]
    fact: The water is pulled up rather than pushed, as it leaves the pores of the leaves and drags an unbroken thread behind it.

  - id: a2-nat-042
    difficulty: 3
    prompt: Which material forms the shells of insects and crabs?
    answer: Chitin
    distractors: [Collagen, Silica, Cellulose]
    fact: The same stuff stiffens the cell walls of fungi, which is one of the odder things insects and mushrooms have in common. Growing means shedding the whole casing and making a new one underneath.

  - id: a2-nat-043
    difficulty: 3
    prompt: What is the term for an animal that is active at night?
    answer: Nocturnal
    distractors: [Diurnal, Hibernal, Vespertine]
    fact: One explanation for the poor color vision of most mammals is that our ancestors kept to the dark for a hundred million years while the dinosaurs had the daylight.

  - id: a2-nat-044
    difficulty: 3
    prompt: Which insect's colony has a single reproducing female and sterile workers?
    answer: The honeybee
    distractors: [The locust, The cicada, The dragonfly]
    fact: A queen mates once, on a single flight, and stores the sperm for years. A worker is a half-sister to the rest, which is the clue to why she does not breed herself.

  - id: a2-nat-045
    difficulty: 3
    prompt: What does an animal do when it undergoes torpor?
    answer: Drops its body temperature and metabolism to save energy
    distractors: [Sheds and regrows its outer layer, Migrates in response to daylight, Stores fat in a single organ]
    fact: Hummingbirds do it every night, dropping their heart rate from over a thousand beats a minute to a few dozen. Hibernation is the long version.

  - id: a2-nat-046
    difficulty: 3
    prompt: Which tree is the oldest known individual living thing?
    answer: A bristlecone pine
    distractors: [A giant sequoia, A baobab, A yew]
    fact: One in the White Mountains of California is over forty-eight hundred years old. They grow in poor soil at altitude, where little else competes and little rots.

  - id: a2-nat-047
    difficulty: 3
    prompt: What is the difference between weather and climate?
    answer: Weather is what happens, climate is the long-run pattern
    distractors: [Weather is local and climate is global, Weather is measured and climate is modeled, Weather is seasonal and climate is yearly]
    fact: Thirty years is the usual period for defining a climate. A cold week says nothing about either, which is what makes the argument so durable.

  - id: a2-nat-048
    difficulty: 3
    prompt: Which animal group do squid, snails and clams belong to?
    answer: Molluscs
    distractors: [Crustaceans, Arthropods, Annelids]
    fact: It is the second largest animal group after the insects and their relatives. A squid and a garden snail share a body plan that is hard to see from outside.

  - id: a2-nat-049
    difficulty: 3
    prompt: What is an atoll?
    answer: A ring of coral around a lagoon
    distractors: [A volcanic island with no beach, A sandbank exposed at low tide, A chain of islets joined by reef]
    fact: 'Darwin worked out how they form: coral grows around a volcanic island, the island sinks, and the ring keeps building upward.'

  - id: a2-nat-050
    difficulty: 3
    prompt: Which bird is the heaviest able to fly?
    answer: The great bustard
    distractors: [The swan, The condor, The pelican]
    fact: Males reach over forty pounds, close to the limit of what wings and muscle can lift. Africa's kori bustard is its only serious rival for the title, depending on whose records you take. They have to run to take off.

  - id: a2-nat-051
    difficulty: 3
    prompt: What causes the seasons?
    answer: The tilt of the earth's axis
    distractors: [The changing distance from the sun, The speed of the earth's orbit, The movement of the moon]
    fact: The earth is closest to the sun in January. The tilt is twenty-three and a half degrees, and without it there would be no seasons at all.

  - id: a2-nat-052
    difficulty: 3
    prompt: Which large mammal spends most of the day in water and is among Africa's most dangerous?
    answer: The hippopotamus
    distractors: [The Cape buffalo, The rhinoceros, The crocodile]
    fact: It cannot swim well and walks along the bottom. Its skin secretes a red fluid that works as a sunblock and an antiseptic.

  - id: a2-nat-053
    difficulty: 3
    prompt: Which cloud type brings thunderstorms?
    answer: Cumulonimbus
    distractors: [Cirrus, Stratus, Altocumulus]
    fact: It can stand ten miles high, flattening into an anvil where it hits the stratosphere and can rise no further.

  - id: a2-nat-054
    difficulty: 3
    prompt: Which animal's young is called a kit?
    answer: The fox
    distractors: [The otter alone, The badger, The hare]
    fact: Beavers, rabbits and ferrets use it too. A fox family lives in an earth and the young stay with the parents through their first summer.

  - id: a2-nat-055
    difficulty: 3
    prompt: What is guano and why was it fought over?
    answer: Seabird droppings, mined as fertilizer
    distractors: [Volcanic ash used in cement, Coral sand used in glassmaking, Dried seaweed used as feed]
    fact: It was so valuable in the nineteenth century that Congress passed a law letting Americans claim any unoccupied island that had it. Peru fought a war partly over the deposits.

  - id: a2-nat-056
    difficulty: 4
    prompt: What is the hottest shade temperature reliably recorded on earth?
    answer: About 134 degrees Fahrenheit
    distractors: [About 118 degrees, About 152 degrees, About 165 degrees]
    fact: Recorded in Death Valley in 1913 and still argued over. A later Libyan reading of 136 was thrown out in 2012 after the equipment was reexamined.

  - id: a2-nat-057
    difficulty: 4
    prompt: Which creature can survive being dried out, frozen and exposed to vacuum?
    answer: The tardigrade
    distractors: [The brine shrimp, The nematode, The rotifer]
    fact: Under a tenth of a millimeter long, with eight legs and claws. It survives by pulling in its legs, expelling its water and shutting down almost completely.

  - id: a2-nat-058
    difficulty: 4
    prompt: What is the function of a whale's baleen?
    answer: It strains small animals out of seawater
    distractors: [It carries sound to the inner ear, It stores oxygen while diving, It scrapes food off the seabed]
    fact: It is made of the same stuff as fingernails and hair, and hangs in plates from the upper jaw. It was the whalebone used for corsets and umbrella ribs.

  - id: a2-nat-059
    difficulty: 4
    prompt: What is the El Nino pattern?
    answer: A warming of the eastern Pacific that shifts weather worldwide
    distractors: [A cooling of the North Atlantic current, A shift in the Asian monsoon winds, A ten-year cycle in solar output]
    fact: Peruvian fishermen named it for the Christ child because it usually arrives around Christmas, killing the fishing by cutting off the cold upwelling.

  - id: a2-nat-060
    difficulty: 4
    prompt: Which American bird was hunted from billions to extinction by 1914?
    answer: The passenger pigeon
    distractors: [The Carolina parakeet, The heath hen, The ivory-billed woodpecker]
    fact: Flocks darkened the sky for days at a time. The last one died in a Cincinnati zoo, and nobody had quite believed a bird that numerous could go.

  - id: a2-nat-061
    difficulty: 4
    prompt: What is the Coriolis effect responsible for?
    answer: The curving path of winds and currents on a spinning earth
    distractors: [The tilt of the earth's axis, The twice-daily tides, The jet stream's speed]
    fact: It is far too weak to turn the water in a sink. It matters over hundreds of miles, which is why storms spin opposite ways in the two hemispheres.

  - id: a2-nat-062
    difficulty: 4
    prompt: Which fish can change sex during its life?
    answer: The clownfish
    distractors: [The salmon, The herring, The pike]
    fact: A group has one breeding female and when she dies the dominant male becomes female. Wrasses and groupers do a version of the same thing.

  - id: a2-nat-063
    difficulty: 4
    prompt: What is a keystone species?
    answer: One whose removal changes the whole ecosystem out of proportion to its numbers
    distractors: [The most numerous species in a habitat, The largest predator in a food chain, The species a habitat is named after]
    fact: Sea otters are the standard case. Remove them and urchins eat the kelp forest, taking everything that lived in it with them.

  - id: a2-nat-064
    difficulty: 4
    prompt: What does a dendrologist study?
    answer: Trees
    distractors: [Teeth, Soil, Caves]
    fact: The root is the Greek for tree, which it shares with the study of growth rings and with the branching diagrams used to show descent.

  - id: a2-nat-065
    difficulty: 4
    prompt: Which bird navigates using a magnetic sense as well as the stars?
    answer: Most migrating songbirds
    distractors: [Only pigeons, Only seabirds, Only raptors]
    fact: The mechanism may be a protein in the eye that reacts to the magnetic field, so the bird could in some sense see direction as a pattern over the landscape.
