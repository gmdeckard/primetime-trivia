category: american-history
pack:
  id: adult1
  name: Adult set 1

# The founding through to about 1900. The Twentieth Century picks it up from
# there, and Military History has the campaigns.

questions:
  - id: amh-001
    difficulty: 2
    prompt: In which year was the Declaration of Independence adopted?
    answer: '1776'
    distractors: ['1775', '1781', '1783']
    fact: The war had already been running a year, and it did not end until the Treaty of Paris in 1783.

  - id: amh-002
    difficulty: 2
    prompt: Which document replaced the Articles of Confederation?
    answer: The Constitution
    distractors: [The Bill of Rights, The Northwest Ordinance, The Declaration of Independence]
    fact: The Articles gave Congress no power to tax, which is mainly what killed them.

  - id: amh-003
    difficulty: 2
    prompt: Which president issued the Emancipation Proclamation?
    answer: Abraham Lincoln
    distractors: [Andrew Johnson, Ulysses Grant, James Buchanan]
    fact: It applied only to states then in rebellion, so it freed nobody the Union actually controlled on the day it took effect.

  - id: amh-004
    difficulty: 2
    prompt: From which country did the United States buy the Louisiana Territory?
    answer: France
    distractors: [Spain, Britain, Mexico]
    fact: Spain had held it until three years earlier. Napoleon needed money and sold it for about four cents an acre.

  - id: amh-005
    difficulty: 2
    prompt: Which 1773 protest saw colonists destroy a shipment of tea?
    answer: The Boston Tea Party
    distractors: [The Stamp Act Riots, The Boston Massacre, Shays' Rebellion]
    fact: They dumped 342 chests into the harbor. The tax being protested had actually lowered the price of tea.

  - id: amh-006
    difficulty: 3
    prompt: Which battle is generally considered the turning point of the Revolutionary War?
    answer: Saratoga
    distractors: [Bunker Hill, Trenton, Yorktown]
    fact: The victory at Saratoga in 1777 brought France in as an ally. Yorktown ended the war but Saratoga is what made it winnable.

  - id: amh-007
    difficulty: 3
    prompt: Who wrote the pamphlet Common Sense in 1776?
    answer: Thomas Paine
    distractors: [Thomas Jefferson, Samuel Adams, Benjamin Franklin]
    fact: It sold perhaps 100,000 copies in three months, in a country of two and a half million people.

  - id: amh-008
    difficulty: 3
    prompt: Which Supreme Court case established the power of judicial review?
    answer: Marbury v. Madison
    distractors: [McCulloch v. Maryland, Dred Scott v. Sandford, Gibbons v. Ogden]
    fact: John Marshall's 1803 ruling claimed a power the Constitution never explicitly grants the court, and it has held ever since.

  - id: amh-009
    difficulty: 3
    prompt: Which compromise admitted Missouri as a slave state and Maine as a free one?
    answer: The Missouri Compromise
    distractors: [The Compromise of 1850, The Kansas-Nebraska Act, The Three-Fifths Compromise]
    fact: The 1820 deal also banned slavery north of a line across the Louisiana Purchase, which the Kansas-Nebraska Act undid in 1854.

  - id: amh-010
    difficulty: 3
    prompt: Which 1848 convention launched the American women's suffrage movement?
    answer: Seneca Falls
    distractors: [Akron, Rochester, Philadelphia]
    fact: Elizabeth Cady Stanton and Lucretia Mott organized it. Sojourner Truth gave her best-known speech in Akron three years later.

  - id: amh-011
    difficulty: 3
    prompt: Which trail carried settlers from Missouri to the Pacific Northwest?
    answer: The Oregon Trail
    distractors: [The Santa Fe Trail, The Chisholm Trail, The Mormon Trail]
    fact: The Santa Fe Trail was a trade route to Mexico and the Chisholm Trail moved cattle, so only one of these was really for families.

  - id: amh-012
    difficulty: 3
    prompt: Which general accepted the Confederate surrender at Appomattox?
    answer: Ulysses Grant
    distractors: [William Sherman, George Meade, George McClellan]
    fact: Grant let the Confederate officers keep their sidearms and the men their horses, on the grounds that they would need them for spring planting.

  - id: amh-013
    difficulty: 3
    prompt: What was the Underground Railroad?
    answer: A network of safe houses for escaping slaves
    distractors: [An early subway system, A smuggling route for Union weapons, A secret telegraph network]
    fact: Harriet Tubman made about thirteen trips south and is thought to have led some seventy people out.

  - id: amh-014
    difficulty: 3
    prompt: Which 1862 act gave settlers 160 acres of public land for farming it?
    answer: The Homestead Act
    distractors: [The Morrill Act, The Dawes Act, The Pacific Railway Act]
    fact: All four passed within thirty years. The Morrill Act funded colleges, the Dawes Act broke up tribal land, and the Pacific Railway Act built the railroad.

  - id: amh-015
    difficulty: 3
    prompt: Where were the two halves of the first transcontinental railroad joined in 1869?
    answer: Promontory Summit
    distractors: [Ogden, Council Bluffs, Sacramento]
    fact: Ogden became the actual junction within months, which is why it is the answer people remember wrongly.

  - id: amh-016
    difficulty: 3
    prompt: Which president was the first to be impeached?
    answer: Andrew Johnson
    distractors: [Ulysses Grant, Andrew Jackson, John Tyler]
    fact: The Senate acquitted him in 1868 by a single vote.

  - id: amh-017
    difficulty: 3
    prompt: Which 1803 expedition did Jefferson fund to find a route to the Pacific?
    answer: The Corps of Discovery
    distractors: [The Pike Expedition, The Long Expedition, The Fremont Survey]
    fact: Better known by its leaders' names. All three wrong answers were real government expeditions west in the decades that followed.

  - id: amh-018
    difficulty: 4
    prompt: Which Virginia planter's 1676 rebellion burned Jamestown?
    answer: Nathaniel Bacon
    distractors: [John Rolfe, William Berkeley, Opechancanough]
    fact: Berkeley was the governor he rebelled against. Historians argue about whether it was a democratic revolt or a land grab aimed at the Powhatan.

  - id: amh-019
    difficulty: 4
    prompt: Which treaty ended the Mexican-American War?
    answer: Guadalupe Hidalgo
    distractors: [Velasco, Ghent, Fort Laramie]
    fact: The 1848 treaty handed over what became California, Nevada, Utah and most of Arizona and New Mexico, for fifteen million dollars.

  - id: amh-020
    difficulty: 4
    prompt: Which Supreme Court ruling held that no Black person could be a US citizen?
    answer: Dred Scott v. Sandford
    distractors: [Plessy v. Ferguson, Prigg v. Pennsylvania, Ableman v. Booth]
    fact: The 1857 decision also struck down the Missouri Compromise. It is usually named as a cause of the war rather than a consequence.

  - id: amh-021
    difficulty: 4
    prompt: Which 1794 uprising did Washington personally ride out to suppress?
    answer: The Whiskey Rebellion
    distractors: [Shays' Rebellion, Fries's Rebellion, The Dorr Rebellion]
    fact: He is the only sitting president ever to lead troops in the field. Shays' Rebellion was eight years earlier and helped prompt the Constitution.

  - id: amh-022
    difficulty: 4
    prompt: Which war did the Treaty of Ghent end?
    answer: The War of 1812
    distractors: [The Revolutionary War, The Mexican-American War, The Seminole Wars]
    fact: It was signed in December 1814. News crossed the Atlantic too slowly to stop the Battle of New Orleans the following January.

  - id: amh-023
    difficulty: 4
    prompt: Which policy of forced removal sent the Cherokee west in 1838?
    answer: The Trail of Tears
    distractors: [The Dawes Allotment, The Long Walk, The Sand Creek Removal]
    fact: The Long Walk was the Navajo, twenty-five years later. The Supreme Court had ruled for the Cherokee and Jackson simply ignored it.

  - id: amh-024
    difficulty: 4
    prompt: Which colony was founded as a refuge for Catholics?
    answer: Maryland
    distractors: [Rhode Island, Pennsylvania, Delaware]
    fact: Rhode Island was founded on religious liberty generally and Pennsylvania by Quakers, so all three were tolerant for different reasons.

  - id: amh-025
    difficulty: 4
    prompt: Which 1896 ruling gave constitutional cover to segregation?
    answer: Plessy v. Ferguson
    distractors: [Dred Scott v. Sandford, The Civil Rights Cases, Cumming v. Richmond]
    fact: The phrase separate but equal comes from it. A single justice dissented, and he had been a slaveholder before the war.
