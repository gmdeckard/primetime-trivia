category: consumer-electronics
pack:
  id: adult1
  name: Adult set 1

# The other half of the old Invention & Technology file: what ended up in the
# living room rather than in a patent office. Formats that won, formats that
# lost, and the gadgets people queued for.

questions:
  - id: inv-027
    difficulty: 3
    prompt: Which format beat Betamax to become the home video standard?
    answer: VHS
    distractors: [LaserDisc, Video 2000, U-matic]
    fact: Betamax had the better picture. VHS had the longer tape, and two hours was what a film needed.

  - id: inv-030
    difficulty: 3
    prompt: Which company made the Walkman?
    answer: Sony
    distractors: [Panasonic, Toshiba, Sharp]
    fact: The co-founder wanted something to play opera on long flights. It had no recording function, which salespeople thought would kill it.

  - id: inv-032
    difficulty: 4
    prompt: What did the first commercially available cell phone cost in 1983, roughly?
    answer: 'About 4,000 dollars'
    distractors: ['About 400 dollars', 'About 1,000 dollars', 'About 10,000 dollars']
    fact: The Motorola DynaTAC weighed close to two pounds and gave about half an hour of talk time per ten-hour charge.

  - id: a35-021
    difficulty: 2
    prompt: Which company released the first iPod, in 2001?
    answer: Apple
    distractors: [Sony, Creative, Microsoft]
    fact: Creative had shipped a hard-drive music player two years earlier and later won a patent settlement over the interface.

  - id: a35-025
    difficulty: 3
    prompt: Which console did Sony launch in 1994 to compete with Nintendo and Sega?
    answer: The PlayStation
    distractors: [The Dreamcast, The Saturn, The Jaguar]
    fact: It began as a CD add-on for the Super Nintendo. The deal collapsed publicly and Sony built the whole machine itself.

  - id: a35-029
    difficulty: 4
    prompt: Which company made the first camera phone widely sold, in 2000?
    answer: Sharp
    distractors: [Nokia, Motorola, Samsung]
    fact: The J-SH04 sold only in Japan and took pictures at 0.1 megapixels, which is smaller than a modern thumbnail.

# The questions from here down came from the Easy Set One batch, folded into
# this deck on 2026-11-05 so the easy end of the bank is reachable without the
# MC switching a second pack on. Generated with claude-opus-5, fact-checked by
# GPT-5 via Codex and by Claude Sonnet in a clean context, no human review.
# Some were seeded by topic from OpenTDB (opentdb.com, CC BY-SA 4.0) and then
# rewritten with new distractors and new fact lines. Old ids are mapped in
# docs/EASY-SET-ONE.md.

  - id: inv-045
    difficulty: 2
    prompt: In which year did the first iPhone go on sale?
    answer: 2007
    distractors: [2005, 2009, 2004]
    fact: Announced in January and sold in June. It could not record video or send a picture message, and there was no App Store — outside apps arrived a year later.
    tags: [phones, opentdb]

  - id: inv-046
    difficulty: 1
    prompt: Which company's voice assistant answers to the name Alexa?
    answer: Amazon
    distractors: [Google, Apple, Microsoft]
    fact: Amazon picked a name with a hard X in it because that consonant is easier to pick out reliably. It will also answer to Echo, Computer or Ziggy if you change the setting.
    tags: [opentdb]

  - id: inv-047
    difficulty: 2
    prompt: What did the RCA in RCA Victor stand for?
    answer: Radio Corporation of America
    distractors: [Recording Company of America, Radio Communications Associates, Radio Components of America]
    fact: Founded in 1919 to keep American radio patents out of foreign hands, and for decades it owned both the records and the players.
    tags: [audio, acronyms]

  - id: inv-048
    difficulty: 2
    prompt: What does the "hi-fi" in a hi-fi system stand for?
    answer: High fidelity
    distractors: [High frequency, High filtration, High finish]
    fact: Fidelity to the original performance. It was a marketing claim before it was a measurement, and the industry spent the 1950s arguing over what it meant.
    tags: [audio]

  - id: inv-049
    difficulty: 2
    prompt: What does the AM on a radio dial stand for?
    answer: Amplitude modulation
    distractors: [Audio modulation, Analog modulation, Ambient modulation]
    fact: FM is frequency modulation, invented by the American engineer Edwin Armstrong, and it resists the static that lightning puts into an AM signal.
    tags: [radio, acronyms]

  - id: inv-050
    difficulty: 2
    prompt: Which game put Atari on the map in 1972, in bars before it reached living rooms?
    answer: Pong
    distractors: [Space Invaders, Breakout, Asteroids]
    fact: Atari tested the prototype in a Sunnyvale tavern in 1972 with a milk carton catching the quarters, and the story goes that it jammed once the carton overflowed.
    tags: [games]

  - id: inv-051
    difficulty: 1
    prompt: What does a turntable spin?
    answer: A record
    distractors: [A tape reel, A compact disc, A film reel]
    fact: An LP turns at thirty-three and a third revolutions a minute, a speed already used for radio transcription discs before Columbia adopted it for the LP in 1948.
    tags: [audio]

  - id: inv-052
    difficulty: 1
    prompt: What was an answering machine for?
    answer: Recording calls that came in while you were out
    distractors: [Dialing numbers automatically, Screening calls from a list, Letting two people call at once]
    fact: Before the phone company offered voicemail, the machine sat by the door and you came home to a blinking light and a count of what you had missed.
    tags: [phones]

  - id: inv-053
    difficulty: 2
    prompt: What were "rabbit ears" on top of a television set?
    answer: An indoor antenna
    distractors: [A pair of speakers, A channel selector, An early remote sensor]
    fact: Two telescoping rods you angled by hand, and the reason a generation of Americans learned that standing in a particular spot improved the picture.
    tags: [television]

  - id: inv-054
    difficulty: 2
    prompt: What did Apple promise the first iPod would put in your pocket?
    answer: A thousand songs
    distractors: [Ten thousand songs, A hundred albums, Your whole record collection]
    fact: 'Five gigabytes in 2001. The line worked because it was concrete: it said what the thing would do rather than what was inside it.'
    tags: [audio]

  - id: inv-055
    difficulty: 2
    prompt: In which year did DVD players first reach American stores?
    answer: 1997
    distractors: [1993, 2000, 1995]
    fact: Players arrived in March, in seven test cities only, and the studios held most films back until they were satisfied the discs could be protected.
    tags: [video]

  - id: inv-056
    difficulty: 2
    prompt: What did a digital video recorder such as TiVo add that a VCR could not manage?
    answer: Pausing and rewinding a live broadcast
    distractors: [Record onto a tape you could keep, Record in color, Play rental tapes]
    fact: It records continuously to a hard disk, so pausing live television really means playing back from that disk a few seconds behind the broadcast.
    tags: [video]

  - id: inv-057
    difficulty: 1
    prompt: What does a stereo system use two channels to do?
    answer: Place sounds between the left and right speakers
    distractors: [Play twice as loud, Play two records at once, Separate music from speech]
    fact: Stereo records reached American shops in 1958, and for several years labels pressed both versions because most people still owned one speaker.
    tags: [audio]

  - id: inv-058
    difficulty: 2
    prompt: What was a Victrola?
    answer: A record player in a wooden cabinet
    distractors: [An early television, A home radio transmitter, A coin-operated piano]
    fact: Sold from 1906 with the horn folded away inside the cabinet, so it could sit in a parlour as furniture rather than as equipment.
    tags: [audio]
