category: us-places
pack:
  id: adult1
  name: Adult set 1

# States, capitals, borders and landmarks. Weighted a little toward the
# Southwest, because that is where the room is sitting.

questions:
  - id: usp-001
    difficulty: 2
    prompt: Which state is known as the Grand Canyon State?
    answer: Arizona
    distractors: [Nevada, Utah, New Mexico]
    fact: It is on the license plate. The canyon became a national park in 1919, seven years after Arizona became a state.

  - id: usp-002
    difficulty: 2
    prompt: What is the capital of Texas?
    answer: Austin
    distractors: [Houston, Dallas, San Antonio]
    fact: Named for Stephen F. Austin. The settlement was called Waterloo until 1839.

  - id: usp-003
    difficulty: 2
    prompt: Which of the Great Lakes lies entirely within the United States?
    answer: Lake Michigan
    distractors: [Lake Superior, Lake Huron, Lake Erie]
    fact: The other four are all shared with Canada.

  - id: usp-004
    difficulty: 2
    prompt: Which river forms most of the border between Texas and Mexico?
    answer: The Rio Grande
    distractors: [The Colorado, The Pecos, The Brazos]
    fact: Mexico knows it as the Rio Bravo del Norte. The Pecos is one of its tributaries.

  - id: usp-005
    difficulty: 2
    prompt: Four Corners joins Arizona, Utah, Colorado and which fourth state?
    answer: New Mexico
    distractors: [Nevada, Wyoming, Kansas]
    fact: It is the only place in the country where four states meet at a single point.

  - id: usp-006
    difficulty: 3
    prompt: Which state is divided into the most counties?
    answer: Texas
    distractors: [Georgia, Kentucky, Missouri]
    fact: Georgia is second with 159, and Delaware manages the whole state with three.

  - id: usp-007
    difficulty: 3
    prompt: Which state was created by breaking away from another state during the Civil War?
    answer: West Virginia
    distractors: [Kentucky, Maryland, Tennessee]
    fact: It split from Virginia and was admitted in 1863. The other three were slave states that stayed in the Union or were divided by it.

  - id: usp-008
    difficulty: 3
    prompt: Which two states do not observe daylight saving time?
    answer: Arizona and Hawaii
    distractors: [Alaska and Hawaii, Arizona and Nevada, Indiana and Arizona]
    fact: The Navajo Nation inside Arizona does observe it, so the state runs on two clocks every summer. Indiana held out until 2006.

  - id: usp-009
    difficulty: 3
    prompt: Which is the highest mountain in the contiguous United States?
    answer: Mount Whitney
    distractors: [Mount Rainier, Pikes Peak, Mount Elbert]
    fact: Whitney stands at 14,505 feet in California. Denali in Alaska is far higher, which is why the question says contiguous.

  - id: usp-010
    difficulty: 3
    prompt: Which state spent nine years as an independent republic before joining the Union in 1845?
    answer: Texas
    distractors: [California, Vermont, Hawaii]
    fact: The Republic of Texas ran from 1836. Vermont and Hawaii were also republics at one point, which is why the date matters here.

  - id: usp-011
    difficulty: 3
    prompt: Which national park was the first in the world, established in 1872?
    answer: Yellowstone
    distractors: [Yosemite, Sequoia, Grand Canyon]
    fact: Yosemite was protected earlier, in 1864, but as a grant to the state of California rather than as a national park.

  - id: usp-012
    difficulty: 3
    prompt: Which city was the seat of the federal government from 1790 to 1800, while Washington was being built?
    answer: Philadelphia
    distractors: [New York, Baltimore, Annapolis]
    fact: All three of the others hosted the Congress at some point in the 1780s, which is what makes them reasonable guesses.

  - id: usp-013
    difficulty: 3
    prompt: Which state is nicknamed the Show-Me State?
    answer: Missouri
    distractors: [Oklahoma, Kansas, Arkansas]
    fact: The phrase is usually traced to an 1899 speech by Congressman Willard Vandiver, though it was in circulation before him.

  - id: usp-014
    difficulty: 3
    prompt: The Mason-Dixon line was originally surveyed to settle a border between which two colonies?
    answer: Pennsylvania and Maryland
    distractors: [Virginia and Maryland, Pennsylvania and Virginia, Maryland and Delaware]
    fact: Charles Mason and Jeremiah Dixon ran the line in the 1760s. Its use as shorthand for the North-South divide came much later.

  - id: usp-015
    difficulty: 3
    prompt: Which state contains the most national parks?
    answer: California
    distractors: [Alaska, Utah, Colorado]
    fact: California has nine, Alaska eight and Utah five.

  - id: usp-016
    difficulty: 3
    prompt: Which is the longest river in the United States?
    answer: The Missouri
    distractors: [The Mississippi, The Colorado, The Rio Grande]
    fact: The Missouri runs about 2,340 miles and joins the Mississippi just north of St Louis, slightly longer than the river it flows into.

  - id: usp-017
    difficulty: 3
    prompt: Which desert covers most of southern Arizona?
    answer: The Sonoran Desert
    distractors: [The Mojave, The Chihuahuan, The Great Basin]
    fact: The saguaro cactus grows wild in the Sonoran and nowhere else, so the postcard image is a reliable clue.

  - id: usp-018
    difficulty: 4
    prompt: Which is the only state whose name begins with two vowels?
    answer: Iowa
    distractors: [Ohio, Oregon, Oklahoma]
    fact: Ohio, Oregon and Oklahoma each open with a single vowel followed by a consonant.

  - id: usp-019
    difficulty: 4
    prompt: Which state capital lies furthest south?
    answer: Honolulu
    distractors: [Austin, Phoenix, Tallahassee]
    fact: Honolulu sits well south of any capital on the mainland, nearer the latitude of Mexico City.

  - id: usp-020
    difficulty: 4
    prompt: Which state has the shortest ocean coastline?
    answer: New Hampshire
    distractors: [Delaware, Rhode Island, Maryland]
    fact: Roughly 18 miles of Atlantic shore, the shortest of any coastal state.

  - id: usp-021
    difficulty: 4
    prompt: Which mountain range runs through western Arkansas and eastern Oklahoma?
    answer: The Ouachita Mountains
    distractors: [The Ozarks, The Cumberland Plateau, The Boston Mountains]
    fact: The Ozarks lie just to the north, and the Boston Mountains are a range within the Ozarks rather than a separate one.

  - id: usp-022
    difficulty: 4
    prompt: Which was the last of the contiguous 48 states to be admitted to the Union?
    answer: Arizona
    distractors: [New Mexico, Oklahoma, Utah]
    fact: Arizona came in on 14 February 1912, six weeks after New Mexico. Nothing else was added until Alaska and Hawaii in 1959.

  - id: usp-023
    difficulty: 4
    prompt: Which is the oldest continuously inhabited city in the United States?
    answer: St Augustine
    distractors: [Santa Fe, Jamestown, Plymouth]
    fact: The Spanish founded it in 1565, more than forty years before Jamestown. Santa Fe followed in 1610.

  - id: usp-024
    difficulty: 4
    prompt: Which state capital cannot be reached by road from the rest of its own state?
    answer: Juneau
    distractors: [Pierre, Montpelier, Dover]
    fact: Juneau has no highway connection to anywhere in Alaska. You arrive by boat or by plane, and the ferry carries the cars.

  - id: usp-025
    difficulty: 4
    prompt: Which state has the highest average elevation?
    answer: Colorado
    distractors: [Wyoming, Utah, Alaska]
    fact: Colorado averages about 6,800 feet and has more than fifty peaks above 14,000, more than any other state.

  - id: usp-026
    difficulty: 2
    prompt: Which city is home to the Space Needle?
    answer: Seattle
    distractors: [Portland, Vancouver, San Francisco]
    fact: Built for the 1962 World's Fair and designed to survive winds far stronger than the city has ever recorded.

  - id: usp-027
    difficulty: 2
    prompt: Which state is Silicon Valley in?
    answer: California
    distractors: [Washington, Oregon, Texas]
    fact: The name comes from the silicon in semiconductors, coined by a trade journalist in 1971.

  - id: usp-028
    difficulty: 3
    prompt: Which city is known as the Mile High City?
    answer: Denver
    distractors: [Salt Lake City, Albuquerque, Boise]
    fact: One step on the Colorado capitol building is exactly a mile above sea level, and it has been re-measured and moved twice.

  - id: usp-029
    difficulty: 3
    prompt: Which US city has the largest population?
    answer: New York
    distractors: [Los Angeles, Chicago, Houston]
    fact: More than twice Los Angeles within the city limits, though the gap narrows sharply on a metro-area basis.

  - id: usp-030
    difficulty: 3
    prompt: Which Yellowstone geyser erupts roughly every ninety minutes?
    answer: Old Faithful
    distractors: [Steamboat, Castle, Grand]
    fact: It is not the largest geyser in the park, only the most predictable, which is how it got the name. Steamboat is the tallest and can go years between eruptions.

  - id: usp-032
    difficulty: 3
    prompt: Which state is the Mall of America in?
    answer: Minnesota
    distractors: [Illinois, Ohio, Michigan]
    fact: Built on the site of the old Metropolitan Stadium. A seat inside marks where a Harmon Killebrew home run landed.

  - id: usp-033
    difficulty: 4
    prompt: Which US state has the fewest people?
    answer: Wyoming
    distractors: [Vermont, Alaska, North Dakota]
    fact: Fewer residents than several individual American cities, in the ninth largest state by area.

  - id: usp-034
    difficulty: 4
    prompt: Which American city is built on a series of islands and bayous below sea level?
    answer: New Orleans
    distractors: [Charleston, Mobile, Galveston]
    fact: Much of it sits below the Mississippi, which is held off by levees and runs past the city higher than the streets.

  - id: a35-041
    difficulty: 2
    prompt: Which city is home to the Gateway Arch?
    answer: St Louis
    distractors: [Kansas City, Memphis, Louisville]
    fact: 630 feet tall and exactly as wide at the base as it is high. Trams inside carry visitors up through the curve in little pods.

  - id: a35-042
    difficulty: 2
    prompt: Which US city is known as Music City?
    answer: Nashville
    distractors: [Memphis, Austin, New Orleans]
    fact: The nickname predates country radio and is usually traced to a touring choir praised by Queen Victoria in the 1870s.

  - id: a35-043
    difficulty: 3
    prompt: Which city hosted the 1996 Summer Olympics?
    answer: Atlanta
    distractors: [Los Angeles, Seoul, Barcelona]
    fact: It beat Athens, which had expected the centenary games and did not take the loss gracefully.

  - id: a35-044
    difficulty: 3
    prompt: Which desert city hosts an annual festival that builds and burns a temporary town?
    answer: Reno
    distractors: [Tucson, Santa Fe, Boise]
    fact: Burning Man moved to the Black Rock Desert north of Reno in 1990 after outgrowing a San Francisco beach.

  - id: a35-045
    difficulty: 3
    prompt: Which American city rebuilt its downtown around a convention center after the 1984 World's Fair bankrupted it?
    answer: New Orleans
    distractors: [Knoxville, Spokane, San Antonio]
    fact: It is the only World's Fair in history to declare bankruptcy while still open to visitors.

  - id: a35-046
    difficulty: 3
    prompt: Which state legalized recreational cannabis first, alongside Washington, in 2012?
    answer: Colorado
    distractors: [Oregon, California, Alaska]
    fact: California had been first for medical use, sixteen years earlier, which is why it is the obvious wrong answer.

  - id: a35-047
    difficulty: 3
    prompt: Which city's Pike Place Market is known for fishmongers throwing fish?
    answer: Seattle
    distractors: [Portland, San Francisco, Baltimore]
    fact: It opened in 1907 so farmers could sell directly, after a public outcry about the price of onions.

  - id: a35-048
    difficulty: 4
    prompt: Which US city has the largest population of any state capital?
    answer: Phoenix
    distractors: [Austin, Denver, Columbus]
    fact: The only state capital with more than a million people, and it has grown by roughly that much again since 1980.

  - id: a35-049
    difficulty: 4
    prompt: Which city was devastated by Hurricane Katrina's levee failures in 2005?
    answer: New Orleans
    distractors: [Mobile, Biloxi, Galveston]
    fact: The storm itself largely missed the city. What flooded it was the collapse of the federal levee system over the following day.

  - id: a35-050
    difficulty: 4
    prompt: Which American city built the first park on a disused elevated railway line?
    answer: New York
    distractors: [Chicago, Philadelphia, Atlanta]
    fact: The High Line was awaiting demolition when neighbours campaigned to keep it. Paris had done the same on a viaduct in 1993, and Chicago followed on its own elevated line in 2015.

  - id: usp-035
    difficulty: 2
    prompt: Which US state has the longest coastline?
    answer: Alaska
    distractors: [Florida, California, Maine]
    fact: Alaska's coast is longer than that of all the other states put together.

  - id: usp-036
    difficulty: 3
    prompt: Which US state borders only one other state?
    answer: Maine
    distractors: [Florida, Alaska, Washington]
    fact: Maine touches only New Hampshire. Alaska borders no state at all.

  - id: usp-037
    difficulty: 3
    prompt: Which U.S. state is the only long-standing commercial coffee producer?
    answer: Hawaii
    distractors: [Florida, California, Louisiana]
    fact: The Kona district of the Big Island is the best known growing area. California now has small plantings, but Hawaii remains the only long-standing commercial producer.
