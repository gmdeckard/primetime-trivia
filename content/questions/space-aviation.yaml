category: space-aviation

questions:
  - id: spa-001
    difficulty: 1
    prompt: Who was the first human to walk on the moon?
    answer: Neil Armstrong
    distractors: [Buzz Aldrin, John Glenn, Alan Shepard]
    fact: Aldrin followed him about nineteen minutes later. Michael Collins stayed in lunar orbit.

  - id: spa-002
    difficulty: 3
    prompt: Which Apollo mission suffered an oxygen tank explosion on the way to the moon?
    answer: Apollo 13
    distractors: [Apollo 1, Apollo 8, Apollo 12]
    fact: Apollo 1 was the fatal pad fire in 1967; Apollo 8 was the first crewed flight around the moon.

  - id: spa-003
    difficulty: 2
    prompt: Who was the first American in space?
    answer: Alan Shepard
    distractors: [John Glenn, Gus Grissom, Scott Carpenter]
    fact: Shepard's 1961 flight was a suborbital hop. Glenn was the first American to orbit, in 1962.

  - id: spa-004
    difficulty: 2
    prompt: What was the name of the first artificial satellite, launched in 1957?
    answer: Sputnik 1
    distractors: [Vostok 1, Explorer 1, Luna 1]
    fact: Explorer 1 was the American answer, in January 1958.

  - id: spa-005
    difficulty: 3
    prompt: Who was the first woman in space?
    answer: Valentina Tereshkova
    distractors: [Sally Ride, Svetlana Savitskaya, Mae Jemison]
    fact: She flew in 1963, twenty years before Sally Ride became the first American woman in space.

  - id: spa-006
    difficulty: 4
    prompt: Which aircraft first broke the sound barrier in level flight, in 1947?
    answer: The Bell X-1
    distractors: [The Douglas D-558, The North American X-15, The Me 163]
    fact: Chuck Yeager flew it with two ribs broken from a riding accident a few days earlier.

  - id: spa-007
    difficulty: 2
    prompt: Which brothers made the first powered aeroplane flight in 1903?
    answer: The Wright brothers
    distractors: [The Montgolfier brothers, The Lilienthal brothers, The Voisin brothers]
    fact: The Montgolfiers flew the first hot air balloon, in 1783.

  - id: spa-008
    difficulty: 3
    prompt: Which was the first supersonic airliner to enter commercial service?
    answer: The Tupolev Tu-144
    distractors: [The Concorde, The Boeing 2707, The Dassault Mirage IV]
    fact: The Tu-144 beat Concorde into service by about two months in 1975, though its career was short and troubled.

  - id: spa-009
    difficulty: 2
    prompt: How many Apollo missions landed men on the moon?
    answer: Six
    distractors: [Four, Five, Seven]
    fact: Apollo 11, 12, 14, 15, 16 and 17. Apollo 13 did not land.

  - id: spa-010
    difficulty: 4
    prompt: Which spacecraft was the first to leave the solar system?
    answer: Voyager 1
    distractors: [Pioneer 10, Voyager 2, New Horizons]
    fact: It crossed the heliopause in 2012, having launched in 1977, and is still transmitting.

  - id: spa-011
    difficulty: 3
    prompt: Who was the first person in space?
    answer: Yuri Gagarin
    distractors: [Gherman Titov, Alan Shepard, Valentina Tereshkova]
    fact: His single orbit on 12 April 1961 lasted 108 minutes. Titov flew next and was the first to spend a day in space.

  - id: spa-012
    difficulty: 2
    prompt: Which company built the Spirit of St. Louis?
    answer: Ryan
    distractors: [Curtiss, Lockheed, Fokker]
    fact: Ryan Airlines of San Diego built it to Lindbergh's specification in about two months.

  - id: spa-013
    difficulty: 3
    prompt: Which airliner, introduced in 1970, was the first wide-body jet?
    answer: The Boeing 747
    distractors: [The Douglas DC-10, The Lockheed L-1011, The Airbus A300]
    fact: Pan Am put it into service on the New York to London route in January 1970.

  - id: spa-014
    difficulty: 4
    prompt: Which American aviator disappeared over the Pacific in 1937?
    answer: Amelia Earhart
    distractors: [Beryl Markham, Jacqueline Cochran, Harriet Quimby]
    fact: She and navigator Fred Noonan vanished between Lae and Howland Island. Neither they nor the aircraft have been found.

  - id: spa-015
    difficulty: 2
    prompt: What does NASA stand for?
    answer: National Aeronautics and Space Administration
    distractors: [National Air and Space Agency, National Aerospace and Science Administration, North American Space Agency]
    fact: It was created in 1958, directly in response to Sputnik.

  - id: spa-016
    difficulty: 3
    prompt: Which space shuttle was lost on launch in January 1986?
    answer: Challenger
    distractors: [Columbia, Discovery, Atlantis]
    fact: Columbia was lost on re-entry in 2003. Challenger failed 73 seconds after lift-off.

  - id: spa-017
    difficulty: 4
    prompt: Which aircraft held the official air speed record for a crewed jet for decades?
    answer: The SR-71 Blackbird
    distractors: [The MiG-25 Foxbat, The F-15 Eagle, The X-15]
    fact: Its 1976 record of about 2,193 mph still stands for an air-breathing crewed aircraft. The X-15 went faster but was rocket-powered and air-launched.

  - id: spa-018
    difficulty: 2
    prompt: Which planet did the Viking landers reach in 1976?
    answer: Mars
    distractors: [Venus, Jupiter, Mercury]
    fact: Viking 1 and 2 returned the first colour panoramas from the Martian surface and ran for years past their design life.

  - id: spa-019
    difficulty: 3
    prompt: Which Mercury astronaut later flew on the space shuttle at the age of 77?
    answer: John Glenn
    distractors: [Alan Shepard, Wally Schirra, Gordon Cooper]
    fact: He flew on Discovery in 1998, thirty-six years after his orbital flight.

  - id: spa-020
    difficulty: 2
    prompt: What was the name of the lunar module that landed on Apollo 11?
    answer: Eagle
    distractors: [Columbia, Falcon, Intrepid]
    fact: Columbia was the command module. "The Eagle has landed" is why the name stuck.

  - id: spa-021
    difficulty: 4
    prompt: Which rocket engine powered the first stage of the Saturn V?
    answer: The F-1
    distractors: [The J-2, The RL-10, The H-1]
    fact: Five F-1 engines burned about 15 tons of propellant a second. The J-2 powered the upper stages.

  - id: spa-022
    difficulty: 3
    prompt: Who was the first woman to fly solo across the Atlantic?
    answer: Amelia Earhart
    distractors: [Beryl Markham, Amy Johnson, Jacqueline Cochran]
    fact: She did it in 1932, five years after Lindbergh. Markham was the first woman to fly it solo east to west, in 1936.

  - id: spa-023
    difficulty: 2
    prompt: Which telescope was launched into orbit in 1990?
    answer: The Hubble Space Telescope
    distractors: [The James Webb Space Telescope, The Spitzer Space Telescope, The Chandra X-ray Observatory]
    fact: Its primary mirror was ground to the wrong shape; a shuttle crew fitted corrective optics in 1993.

  - id: spa-024
    difficulty: 3
    prompt: Which was the first jet airliner to enter commercial service?
    answer: The de Havilland Comet
    distractors: [The Boeing 707, The Douglas DC-8, The Sud Caravelle]
    fact: It entered service in 1952, but a series of fatal structural failures grounded it and handed the market to Boeing.

  - id: spa-025
    difficulty: 4
    prompt: What is the term for the point in an orbit closest to the earth?
    answer: Perigee
    distractors: [Apogee, Perihelion, Aphelion]
    fact: Perihelion and aphelion are the equivalents for an orbit around the sun.

  - id: spa-026
    difficulty: 2
    prompt: Which American pilot made the first solo nonstop transatlantic flight?
    answer: Charles Lindbergh
    distractors: [Wiley Post, Howard Hughes, Eddie Rickenbacker]
    fact: He flew New York to Paris in May 1927, in just over 33 hours, with no radio and no forward windscreen.

  - id: spa-027
    difficulty: 3
    prompt: Which Soviet space station preceded the International Space Station?
    answer: Mir
    distractors: [Salyut 1, Skylab, Almaz]
    fact: Mir operated from 1986 to 2001. Skylab was the American station of the 1970s.

  - id: spa-028
    difficulty: 2
    prompt: What was Project Mercury's successor programme, which flew two-man crews?
    answer: Gemini
    distractors: [Apollo, Vostok, Skylab]
    fact: Gemini proved rendezvous, docking and spacewalking — all of it necessary before Apollo could work.

  - id: spa-029
    difficulty: 4
    prompt: Which WWII fighter was known to the Allies as the "Zero"?
    answer: The Mitsubishi A6M
    distractors: [The Nakajima Ki-43, The Kawasaki Ki-61, The Mitsubishi G4M]
    fact: Allied pilots also called it the Zeke. The Ki-43 was the army's roughly comparable Oscar.

  - id: spa-030
    difficulty: 3
    prompt: Which was the first aircraft to carry passengers faster than the speed of sound in scheduled service from the West?
    answer: Concorde
    distractors: [The Boeing 2707, The Tu-144, The Lockheed L-2000]
    fact: British Airways and Air France began Concorde service on the same day in January 1976. The Boeing and Lockheed designs were cancelled before flying.
