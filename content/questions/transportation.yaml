category: transportation
audience: 55-75

# Road, rail and sea. Space & Aviation has anything that leaves the ground,
# and Explorers & Voyages has the voyages of discovery.

questions:
  - id: trn-001
    difficulty: 2
    prompt: Which Ford model was the first built on a moving assembly line?
    answer: The Model T
    distractors: [The Model A, The Model N, The Quadricycle]
    fact: The line cut assembly from about twelve hours to ninety minutes, and the price fell nearly every year for a decade.

  - id: trn-002
    difficulty: 2
    prompt: Which liner sank on her maiden voyage in 1912?
    answer: The Titanic
    distractors: [The Lusitania, The Britannic, The Olympic]
    fact: Olympic was her near-identical sister and sailed for 24 years. Britannic, the third sister, was mined and sank in 1916.

  - id: trn-003
    difficulty: 2
    prompt: Which highway ran from Chicago to Santa Monica?
    answer: Route 66
    distractors: [Route 1, The Lincoln Highway, The Dixie Highway]
    fact: It was taken off the map in 1985, after the interstates had replaced it a stretch at a time.

  - id: trn-004
    difficulty: 2
    prompt: What kind of engine did Rudolf Diesel patent?
    answer: A compression-ignition engine
    distractors: [A spark-ignition engine, A rotary engine, A steam turbine]
    fact: His first ran on peanut oil. He disappeared from a Channel ferry in 1913 and was never satisfactorily accounted for.

  - id: trn-005
    difficulty: 2
    prompt: Which canal links the Mediterranean to the Red Sea?
    answer: The Suez Canal
    distractors: [The Panama Canal, The Kiel Canal, The Corinth Canal]
    fact: It opened in 1869 and has no locks at all, because both ends sit at very nearly the same level.

  - id: trn-006
    difficulty: 3
    prompt: Which was the first road route built clear across the United States?
    answer: The Lincoln Highway
    distractors: [Route 66, The National Road, The Dixie Highway]
    fact: Announced in 1913, New York to San Francisco. Long stretches of it stayed unpaved dirt for another twenty years.

  - id: trn-007
    difficulty: 3
    prompt: Which ship took the Blue Riband in 1952 and never lost it?
    answer: The SS United States
    distractors: [The Queen Mary, The Normandie, The Queen Elizabeth]
    fact: She crossed in three days and ten hours. She was built so she could be converted to a troopship, and has been laid up for decades.

  - id: trn-008
    difficulty: 3
    prompt: Which locomotive holds the official record for the fastest steam run?
    answer: Mallard
    distractors: [The Flying Scotsman, Rocket, City of Truro]
    fact: 126 mph in 1938, downhill, and it damaged the engine. City of Truro claimed 100 mph in 1904 but the timing was never accepted.

  - id: trn-009
    difficulty: 3
    prompt: Which magnate built the New York Central railroad system?
    answer: Cornelius Vanderbilt
    distractors: [Jay Gould, Collis Huntington, James J. Hill]
    fact: All four were real rail barons. Hill built the Great Northern with no federal land grant and never stopped reminding people.

  - id: trn-010
    difficulty: 3
    prompt: What triggered the Pullman Strike of 1894?
    answer: Wage cuts with no cut in company-town rents
    distractors: [A fatal boiler explosion, The hiring of non-union crews, A change to the eight-hour day]
    fact: Pullman owned the town his workers lived in. He cut their pay and left their rent exactly where it was.

  - id: trn-011
    difficulty: 3
    prompt: Which car did Ferdinand Porsche design as a people's car?
    answer: The Volkswagen Beetle
    distractors: [The Opel Kadett, The DKW F8, The Mercedes 170]
    fact: Almost none were delivered to civilians before the war. Production only took off afterwards, under British Army control of a bombed-out factory.

  - id: trn-012
    difficulty: 3
    prompt: Which bridge was the longest suspension span in the world when it opened in 1937?
    answer: The Golden Gate
    distractors: [The Brooklyn Bridge, The George Washington Bridge, The Verrazzano-Narrows]
    fact: The George Washington had held the record since 1931 and the Verrazzano took it in 1964, so all three held it at some point.

  - id: trn-013
    difficulty: 3
    prompt: What does the Plimsoll line on a ship's hull mark?
    answer: The maximum safe loading depth
    distractors: [The waterline when empty, The limit of the hull plating, The depth of the keel]
    fact: Samuel Plimsoll forced it through Parliament against owners who were overloading ships they had over-insured.

  - id: trn-014
    difficulty: 3
    prompt: Which city opened the world's first underground railway, in 1863?
    answer: London
    distractors: [New York, Paris, Budapest]
    fact: It ran steam locomotives in tunnels, which was every bit as unpleasant as it sounds. Budapest built the first on the European mainland.

  - id: trn-015
    difficulty: 3
    prompt: Which president signed the act creating the Interstate Highway System?
    answer: Dwight Eisenhower
    distractors: [Harry Truman, Franklin Roosevelt, John Kennedy]
    fact: As a young officer he crossed the country in an Army convoy in 1919. It took 62 days. He later saw the German autobahns.

  - id: trn-016
    difficulty: 3
    prompt: What is the standard railway gauge used across most of the world?
    answer: 4 feet 8 and a half inches
    distractors: [5 feet exactly, 3 feet 6 inches, 4 feet exactly]
    fact: It came off the Stephensons' colliery wagonways in the north of England and spread wherever British engineers built railways.

  - id: trn-017
    difficulty: 3
    prompt: Which railway engineer died in a 1900 wreck and became the subject of a ballad?
    answer: Casey Jones
    distractors: [John Henry, Joe Hill, Jesse James]
    fact: He stayed on the brakes to slow the train and was the only person killed. John Henry was a steel-driver and probably never existed.

  - id: trn-018
    difficulty: 4
    prompt: Which ship made the first Atlantic crossing using steam power, in 1819?
    answer: The SS Savannah
    distractors: [The SS Great Western, The SS Sirius, The SS Great Eastern]
    fact: She used the engine for a fraction of the crossing and sailed the rest, which is precisely why the word first gets argued over.

  - id: trn-019
    difficulty: 4
    prompt: Which engineer built the Great Western Railway and the SS Great Eastern?
    answer: Isambard Kingdom Brunel
    distractors: [Robert Stephenson, Thomas Telford, John Rennie]
    fact: The Great Eastern lost money for everyone who touched her, then found a use laying the first lasting transatlantic telegraph cable.

  - id: trn-020
    difficulty: 4
    prompt: Which American marque introduced the electric self-starter in 1912?
    answer: Cadillac
    distractors: [Ford, Buick, Packard]
    fact: It followed a death caused by a hand crank kicking back. More than anything else it is what put women behind the wheel.

  - id: trn-021
    difficulty: 4
    prompt: Which country opened the world's first high-speed rail line, in 1964?
    answer: Japan
    distractors: [France, Germany, Italy]
    fact: The Shinkansen opened days before the Tokyo Olympics. France's TGV followed seventeen years later.

  - id: trn-022
    difficulty: 4
    prompt: Which 1887 law created the first federal regulatory agency, to control railway rates?
    answer: The Interstate Commerce Act
    distractors: [The Sherman Antitrust Act, The Hepburn Act, The Elkins Act]
    fact: Sherman came three years afterwards, and the other two were later laws that put teeth into this one.

  - id: trn-023
    difficulty: 4
    prompt: Who led the failed French attempt to build the Panama Canal?
    answer: Ferdinand de Lesseps
    distractors: [John Stevens, George Goethals, Philippe Bunau-Varilla]
    fact: He had built Suez and tried the same sea-level design in Panama. Disease and the terrain beat him, and Goethals finished the job for the Americans.

  - id: trn-024
    difficulty: 4
    prompt: Which 1934 car brought front-wheel drive and a unitary body to the mass market?
    answer: The Citroen Traction Avant
    distractors: [The Austin Seven, The Fiat Topolino, The Renault Juvaquatre]
    fact: Developing it bankrupted Citroen, and Michelin took the company over. The car itself stayed in production for 23 years.

  - id: trn-025
    difficulty: 4
    prompt: Which 1956 innovation by Malcolm McLean reshaped world shipping?
    answer: The shipping container
    distractors: [The supertanker, The bulk carrier, The roll-on roll-off ferry]
    fact: He ran a trucking company, not a shipping line, which is exactly why he could see that the loading was the expensive part.
