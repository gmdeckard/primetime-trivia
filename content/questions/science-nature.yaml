category: science-nature

questions:
  - id: sci-001
    difficulty: 2
    prompt: Which element has the atomic number 1?
    answer: Hydrogen
    distractors: [Helium, Lithium, Carbon]
    fact: It makes up roughly three-quarters of the ordinary matter in the universe by mass.

  - id: sci-002
    difficulty: 3
    prompt: Which scientist proposed the theory of continental drift in 1912?
    answer: Alfred Wegener
    distractors: [Charles Lyell, James Hutton, Harry Hess]
    fact: He was largely dismissed for decades because he could not explain a mechanism. Plate tectonics supplied one in the 1960s.

  - id: sci-003
    difficulty: 2
    prompt: How many chambers does the human heart have?
    answer: Four
    distractors: [Two, Three, Six]
    fact: Two atria and two ventricles. Fish have two chambers and most reptiles three.

  - id: sci-004
    difficulty: 3
    prompt: What is the most abundant gas in the earth's atmosphere?
    answer: Nitrogen
    distractors: [Oxygen, Carbon dioxide, Argon]
    fact: About 78 per cent nitrogen to 21 per cent oxygen. Argon is third, at just under 1 per cent.

  - id: sci-005
    difficulty: 4
    prompt: Which physicist formulated the uncertainty principle?
    answer: Werner Heisenberg
    distractors: [Niels Bohr, Erwin Schrödinger, Max Planck]
    fact: Published in 1927, it holds that position and momentum cannot both be known precisely — a limit of nature, not of instruments.

  - id: sci-006
    difficulty: 1
    prompt: What is the largest animal that has ever lived?
    answer: The blue whale
    distractors: [The African elephant, Argentinosaurus, The sperm whale]
    fact: Adults reach about 100 feet and 150 tons, heavier than any known dinosaur.

  - id: sci-007
    difficulty: 3
    prompt: Which blood type is known as the universal donor for red cells?
    answer: O negative
    distractors: [AB positive, A negative, O positive]
    fact: AB positive is the universal recipient — the mirror image of the same logic.

  - id: sci-008
    difficulty: 2
    prompt: Which planet has the Great Red Spot?
    answer: Jupiter
    distractors: [Mars, Saturn, Neptune]
    fact: It is a storm wider than the earth, observed for at least 190 years and apparently shrinking.

  - id: sci-009
    difficulty: 4
    prompt: What does DNA stand for?
    answer: Deoxyribonucleic acid
    distractors: [Diribonucleic acid, Deoxyribose nucleic amine, Dinucleic acid]
    fact: Watson and Crick published the double helix structure in 1953, drawing on Rosalind Franklin's X-ray diffraction work.

  - id: sci-010
    difficulty: 2
    prompt: Which vitamin is produced by the skin in response to sunlight?
    answer: Vitamin D
    distractors: [Vitamin C, Vitamin A, Vitamin B12]
    fact: Deficiency causes rickets in children, which is why milk has been fortified since the 1930s.

  - id: sci-011
    difficulty: 3
    prompt: What is the hardest naturally occurring substance?
    answer: Diamond
    distractors: [Quartz, Corundum, Topaz]
    fact: It sits at 10 on the Mohs scale; corundum, which includes rubies and sapphires, is 9.

  - id: sci-012
    difficulty: 2
    prompt: Which gas do plants absorb from the air for photosynthesis?
    answer: Carbon dioxide
    distractors: [Oxygen, Nitrogen, Methane]
    fact: They release oxygen as a by-product, which is the reason the atmosphere has any to speak of.

  - id: sci-013
    difficulty: 4
    prompt: Which bone is the longest in the human body?
    answer: The femur
    distractors: [The tibia, The humerus, The fibula]
    fact: It accounts for roughly a quarter of a person's height.

  - id: sci-014
    difficulty: 3
    prompt: Which naturalist published "On the Origin of Species" in 1859?
    answer: Charles Darwin
    distractors: [Alfred Russel Wallace, Gregor Mendel, Jean-Baptiste Lamarck]
    fact: Wallace reached similar conclusions independently, which is what finally pushed Darwin to publish.

  - id: sci-015
    difficulty: 2
    prompt: What is the speed of light in a vacuum, to the nearest thousand kilometres per second?
    answer: 300,000 km per second
    distractors: ['150,000 km per second', '500,000 km per second', '1,000,000 km per second']
    fact: More precisely 299,792 kilometres per second, a value now used to define the metre.

  - id: sci-016
    difficulty: 3
    prompt: Which organ produces insulin?
    answer: The pancreas
    distractors: [The liver, The thyroid, The adrenal gland]
    fact: Banting and Best isolated it in Toronto in 1921, turning type 1 diabetes from fatal to manageable.

  - id: sci-017
    difficulty: 4
    prompt: What is the study of fungi called?
    answer: Mycology
    distractors: [Phycology, Bryology, Entomology]
    fact: Phycology is algae, bryology is mosses, entomology is insects.

  - id: sci-018
    difficulty: 2
    prompt: How many pairs of chromosomes does a human normally have?
    answer: Twenty-three
    distractors: [Twenty-one, Twenty-four, Forty-six]
    fact: Forty-six chromosomes in twenty-three pairs — the single most common way to get this question wrong.

  - id: sci-019
    difficulty: 3
    prompt: Which scientist discovered penicillin?
    answer: Alexander Fleming
    distractors: [Louis Pasteur, Jonas Salk, Paul Ehrlich]
    fact: He noticed mould killing bacteria on a neglected culture plate in 1928. Florey and Chain made it a usable drug a decade later.

  - id: sci-020
    difficulty: 2
    prompt: Which is the smallest planet in the solar system?
    answer: Mercury
    distractors: [Mars, Venus, Pluto]
    fact: Since Pluto's reclassification in 2006, Mercury holds the title.

  - id: sci-021
    difficulty: 4
    prompt: Which part of the brain controls balance and coordination?
    answer: The cerebellum
    distractors: [The cerebrum, The medulla, The hypothalamus]
    fact: It holds more than half the brain's neurons in about a tenth of its volume.

  - id: sci-022
    difficulty: 3
    prompt: What is the chemical symbol for gold?
    answer: Au
    distractors: [Ag, Go, Gd]
    fact: From the Latin aurum. Ag is silver, from argentum.

  - id: sci-023
    difficulty: 2
    prompt: Which animal group do dolphins belong to?
    answer: Mammals
    distractors: [Fish, Reptiles, Amphibians]
    fact: They are warm-blooded, breathe air and nurse their young.

  - id: sci-024
    difficulty: 4
    prompt: Which law of thermodynamics states that entropy in a closed system tends to increase?
    answer: The second
    distractors: [The first, The third, The zeroth]
    fact: The first is conservation of energy; the third concerns absolute zero.

  - id: sci-025
    difficulty: 3
    prompt: Which tree is the tallest species on earth?
    answer: The coast redwood
    distractors: [The giant sequoia, The Douglas fir, The mountain ash]
    fact: Sequoia sempervirens exceeds 370 feet. The giant sequoia is more massive but not as tall.

  - id: sci-026
    difficulty: 2
    prompt: What causes the tides?
    answer: The gravitational pull of the moon and sun
    distractors: [The rotation of the earth alone, Prevailing winds, Variations in water temperature]
    fact: The moon dominates, but the sun's contribution produces the stronger spring tides when the two align.

  - id: sci-027
    difficulty: 4
    prompt: Which Austrian monk established the basic laws of heredity using pea plants?
    answer: Gregor Mendel
    distractors: [Charles Darwin, Thomas Hunt Morgan, Hugo de Vries]
    fact: His 1866 paper was almost entirely ignored until it was rediscovered around 1900.

  - id: sci-028
    difficulty: 3
    prompt: What is the most common blood type worldwide?
    answer: O positive
    distractors: [A positive, B positive, AB negative]
    fact: AB negative is the rarest, at well under 1 per cent of most populations.

  - id: sci-029
    difficulty: 2
    prompt: Which scale measures the acidity or alkalinity of a solution?
    answer: The pH scale
    distractors: [The Richter scale, The Mohs scale, The Kelvin scale]
    fact: It runs from 0 to 14, with 7 neutral, and is logarithmic — so pH 4 is ten times as acidic as pH 5.

  - id: sci-030
    difficulty: 3
    prompt: Which bird can fly backwards?
    answer: The hummingbird
    distractors: [The kingfisher, The swift, The kestrel]
    fact: Its wings trace a figure of eight, letting it hover and reverse — unique among birds.
