category: business-economics

questions:
  - id: biz-001
    difficulty: 2
    prompt: Which two men founded Hewlett-Packard in a Palo Alto garage in 1939?
    answer: Bill Hewlett and Dave Packard
    distractors: [Gordon Moore and Robert Noyce, Steve Jobs and Steve Wozniak, William Shockley and John Bardeen]
    fact: A coin toss decided whose name came first. The garage is now a California historic landmark.

  - id: biz-002
    difficulty: 3
    prompt: Which economist wrote "The General Theory of Employment, Interest and Money" in 1936?
    answer: John Maynard Keynes
    distractors: [Milton Friedman, Friedrich Hayek, Joseph Schumpeter]
    fact: It argued that governments should spend into a downturn, and reshaped policy for a generation.

  - id: biz-003
    difficulty: 2
    prompt: Which company's founder introduced the five-dollar day in 1914?
    answer: Ford
    distractors: [General Motors, Carnegie Steel, Standard Oil]
    fact: It roughly doubled prevailing wages. Ford's stated reasoning was that it cut turnover and let workers buy the cars.

  - id: biz-004
    difficulty: 3
    prompt: What does the acronym OPEC stand for?
    answer: Organization of the Petroleum Exporting Countries
    distractors: [Organization for Petroleum Export Control, Oil Producing and Exporting Confederation, Organization of Petroleum and Energy Commerce]
    fact: Founded in Baghdad in 1960 by five countries; it now has a dozen or so members.

  - id: biz-005
    difficulty: 4
    prompt: Which 1933 US law separated commercial from investment banking?
    answer: The Glass-Steagall Act
    distractors: [The Securities Exchange Act, The Sherman Antitrust Act, The Dodd-Frank Act]
    fact: Its key separations were repealed in 1999, a decision much revisited after 2008.

  - id: biz-006
    difficulty: 2
    prompt: Which Scottish economist wrote "The Wealth of Nations"?
    answer: Adam Smith
    distractors: [David Ricardo, John Stuart Mill, Thomas Malthus]
    fact: Published in 1776. The "invisible hand" appears just once in the whole book.

  - id: biz-007
    difficulty: 3
    prompt: Which company was broken up by antitrust action in 1911?
    answer: Standard Oil
    distractors: [US Steel, AT&T, American Tobacco]
    fact: It split into 34 companies, among them the ancestors of Exxon, Mobil and Chevron. American Tobacco was also broken up the same year.

  - id: biz-008
    difficulty: 2
    prompt: What does GDP stand for?
    answer: Gross domestic product
    distractors: [General domestic production, Gross development product, Gross distributed profit]
    fact: It counts output produced inside a country's borders; gross national product counts output by its nationals wherever they are.

  - id: biz-009
    difficulty: 4
    prompt: Which 1944 conference established the postwar international monetary system?
    answer: Bretton Woods
    distractors: [Yalta, Potsdam, Dumbarton Oaks]
    fact: It created the IMF and the forerunner of the World Bank, and pegged currencies to the dollar. Nixon ended the gold link in 1971.

  - id: biz-010
    difficulty: 2
    prompt: Which airline was the first to operate a scheduled transatlantic jet service?
    answer: BOAC
    distractors: [Pan Am, TWA, KLM]
    fact: BOAC flew the Comet 4 to New York in October 1958, beating Pan Am's 707 by about three weeks.

  - id: biz-011
    difficulty: 3
    prompt: Who founded Walmart, opening the first store in Rogers, Arkansas, in 1962?
    answer: Sam Walton
    distractors: [Sol Price, Harry Cunningham, Fred Meyer]
    fact: Kmart and Target both also opened their first stores in 1962 — a remarkable year for American retail.

  - id: biz-012
    difficulty: 2
    prompt: Which index is composed of 30 large US industrial companies?
    answer: The Dow Jones Industrial Average
    distractors: [The S&P 500, The NASDAQ Composite, The Russell 2000]
    fact: It is price-weighted, not market-cap weighted, which is why a high-priced share moves it more.

  - id: biz-013
    difficulty: 4
    prompt: Which economist popularized the term "creative destruction"?
    answer: Joseph Schumpeter
    distractors: [Karl Marx, Friedrich Hayek, Thorstein Veblen]
    fact: He argued that capitalism's engine was entrepreneurs destroying existing arrangements, not price competition.

  - id: biz-014
    difficulty: 2
    prompt: Which soft drink company was founded in Atlanta in 1886?
    answer: Coca-Cola
    distractors: [Pepsi-Cola, Dr Pepper, Royal Crown]
    fact: Dr Pepper actually predates it by a year, from Waco, Texas.

  - id: biz-015
    difficulty: 3
    prompt: What was the first product sold under the Sony brand name?
    answer: A transistor radio
    distractors: [A television, A tape recorder, A record player]
    fact: The TR-55 of 1955 was Japan's first transistor radio. The company was then still called Tokyo Tsushin Kogyo.

  - id: biz-016
    difficulty: 2
    prompt: Which American carmaker introduced the Mustang in 1964?
    answer: Ford
    distractors: [Chevrolet, Plymouth, Pontiac]
    fact: It sold over 400,000 in its first year against a forecast of about 100,000.

  - id: biz-017
    difficulty: 4
    prompt: Which 1930 US tariff act is widely blamed for deepening the Depression?
    answer: Smoot-Hawley
    distractors: [McKinley, Fordney-McCumber, Underwood]
    fact: More than a thousand economists petitioned Hoover to veto it. He signed it, and world trade contracted sharply.

  - id: biz-018
    difficulty: 3
    prompt: Which company's slogan was "Think small", in a celebrated 1959 advertising campaign?
    answer: Volkswagen
    distractors: [Honda, Fiat, Renault]
    fact: Doyle Dane Bernbach created it, and it is regularly voted the best advertising campaign of the twentieth century.

  - id: biz-019
    difficulty: 2
    prompt: What does the "Fed" refer to in American economic news?
    answer: The Federal Reserve System
    distractors: [The Federal Trade Commission, The Federal Deposit Insurance Corporation, The Federal Housing Administration]
    fact: It was created in 1913 after a series of banking panics, and has twelve regional reserve banks.

  - id: biz-020
    difficulty: 3
    prompt: Which Japanese manufacturing philosophy emphasizes eliminating waste and continuous improvement?
    answer: The Toyota Production System
    distractors: [Six Sigma, Total Quality Management, Theory of Constraints]
    fact: Six Sigma came out of Motorola in the 1980s. W. Edwards Deming's teaching in postwar Japan influenced both traditions.

  - id: biz-021
    difficulty: 2
    prompt: Which two men founded Apple Computer in 1976?
    answer: Steve Jobs and Steve Wozniak
    distractors: [Bill Gates and Paul Allen, Gordon Moore and Robert Noyce, Larry Ellison and Bob Miner]
    fact: Ronald Wayne was a third founder who sold his 10 per cent stake back within two weeks for $800.

  - id: biz-022
    difficulty: 4
    prompt: What is the economic term for a sustained fall in the general price level?
    answer: Deflation
    distractors: [Disinflation, Stagflation, Recession]
    fact: Disinflation is a slowing of inflation, not a fall in prices — a distinction that matters a great deal to central bankers.

  - id: biz-023
    difficulty: 2
    prompt: Which company introduced the first commercially successful photocopier in 1959?
    answer: Xerox
    distractors: [IBM, Kodak, 3M]
    fact: The Xerox 914 was so successful that the company's name became a verb, which its lawyers have fought ever since.

  - id: biz-024
    difficulty: 3
    prompt: What is a "blue chip" stock?
    answer: Shares in a large, well-established, financially sound company
    distractors: [A newly listed technology company, A share trading below one dollar, A government bond]
    fact: The term comes from poker, where blue chips carry the highest value.

  - id: biz-025
    difficulty: 2
    prompt: Which bank failure in 1995 was caused by a single trader in Singapore?
    answer: Barings
    distractors: [Lehman Brothers, Long-Term Capital Management, BCCI]
    fact: Nick Leeson's unauthorized futures positions cost about £827 million and destroyed a 233-year-old bank.

  - id: biz-026
    difficulty: 4
    prompt: What does the Gini coefficient measure?
    answer: Income or wealth inequality
    distractors: [Inflation expectations, Market concentration, Currency volatility]
    fact: It runs from 0, perfect equality, to 1, where one person holds everything.

  - id: biz-027
    difficulty: 2
    prompt: Which company made the Model T?
    answer: Ford
    distractors: [Oldsmobile, Studebaker, Packard]
    fact: Some fifteen million were built between 1908 and 1927, at a price that fell for most of that run.

  - id: biz-028
    difficulty: 3
    prompt: What is the New York Stock Exchange's nickname, taken from its address?
    answer: The Big Board
    distractors: [The Street, The Curb, The Pit]
    fact: '"The Curb" was the old name for the American Stock Exchange, which really did trade on the curb outside.'

  - id: biz-029
    difficulty: 4
    prompt: Which American businessman built a steel empire and then gave away most of his fortune to libraries?
    answer: Andrew Carnegie
    distractors: [John D. Rockefeller, J. P. Morgan, Cornelius Vanderbilt]
    fact: He funded over 2,500 libraries. His essay "The Gospel of Wealth" argued the rich were obliged to give it away.

  - id: biz-030
    difficulty: 3
    prompt: Which 1971 decision ended the convertibility of US dollars into gold?
    answer: The Nixon shock
    distractors: [The Plaza Accord, The Louvre Accord, The Volcker shock]
    fact: The Plaza Accord of 1985 coordinated a dollar devaluation; the Volcker shock was the interest-rate squeeze of 1979-81.

  - id: biz-031
    difficulty: 2
    prompt: Which company uses a swoosh as its logo?
    answer: Nike
    distractors: [Adidas, Puma, Reebok]
    fact: A design student was paid 35 dollars for it in 1971. She was given company stock years later.

  - id: biz-032
    difficulty: 2
    prompt: Which company is identified by golden arches?
    answer: McDonald's
    distractors: [Burger King, Wendy's, Hardee's]
    fact: The arches were part of the actual architecture of the early restaurants before anyone thought to use them as a logo.

  - id: biz-033
    difficulty: 3
    prompt: What does IPO stand for?
    answer: Initial public offering
    distractors: [International purchase order, Investor profit option, Interim private offering]
    fact: It is the point at which a private company's shares can be bought by anyone, and its accounts become public reading.

  - id: biz-034
    difficulty: 3
    prompt: What is inflation?
    answer: A general rise in prices over time
    distractors: [A rise in unemployment, A fall in the money supply, A rise in interest rates]
    fact: Central banks generally aim for a low positive rate, on the view that prices falling is harder to escape than prices rising.

  - id: biz-035
    difficulty: 4
    prompt: Which Japanese manufacturing approach aims to eliminate waste and hold minimal inventory?
    answer: Just-in-time
    distractors: [Six Sigma, Total quality management, Kaizen costing]
    fact: Developed at Toyota. It works beautifully until a supply chain breaks, which the 2020s demonstrated at length.
