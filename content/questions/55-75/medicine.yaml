category: medicine

# Medicine, the human body and the people who worked it out. History and
# anatomy, never symptoms — a room of seventy-year-olds did not come out
# for a health quiz.

questions:
  - id: med-001
    difficulty: 2
    prompt: How many chambers does the human heart have?
    answer: Four
    distractors: [Two, Three, Six]
    fact: Two atria and two ventricles. Fish have two chambers and most reptiles three.
  - id: med-002
    difficulty: 3
    prompt: Which blood type is known as the universal donor for red cells?
    answer: O negative
    distractors: [AB positive, A negative, O positive]
    fact: AB positive is the universal recipient — the mirror image of the same logic.
  - id: med-003
    difficulty: 2
    prompt: Which vitamin is produced by the skin in response to sunlight?
    answer: Vitamin D
    distractors: [Vitamin C, Vitamin A, Vitamin B12]
    fact: Deficiency causes rickets in children, which is why milk has been fortified since the 1930s.
  - id: med-004
    difficulty: 4
    prompt: Which bone is the longest in the human body?
    answer: The femur
    distractors: [The tibia, The humerus, The fibula]
    fact: It accounts for roughly a quarter of a person's height.
  - id: med-005
    difficulty: 3
    prompt: Which organ produces insulin?
    answer: The pancreas
    distractors: [The liver, The thyroid, The adrenal gland]
    fact: Banting and Best isolated it in Toronto in 1921, turning type 1 diabetes from fatal to manageable.
  - id: med-006
    difficulty: 2
    prompt: How many pairs of chromosomes does a human normally have?
    answer: Twenty-three
    distractors: [Twenty-one, Twenty-four, Forty-six]
    fact: Forty-six chromosomes in twenty-three pairs — the single most common way to get this question wrong.
  - id: med-007
    difficulty: 3
    prompt: Which scientist discovered penicillin?
    answer: Alexander Fleming
    distractors: [Louis Pasteur, Jonas Salk, Paul Ehrlich]
    fact: He noticed mold killing bacteria on a neglected culture plate in 1928. Florey and Chain made it a usable drug a decade later.
  - id: med-008
    difficulty: 4
    prompt: Which part of the brain controls balance and coordination?
    answer: The cerebellum
    distractors: [The cerebrum, The medulla, The hypothalamus]
    fact: It holds more than half the brain's neurons in about a tenth of its volume.
  - id: med-009
    difficulty: 3
    prompt: What is the most common blood type worldwide?
    answer: O positive
    distractors: [A positive, B positive, AB negative]
    fact: AB negative is the rarest, at well under 1 per cent of most populations.

  - id: med-010
    difficulty: 2
    prompt: Deficiency of which vitamin causes scurvy?
    answer: Vitamin C
    distractors: [Vitamin A, Vitamin B12, Vitamin D]
    fact: The Royal Navy issued citrus to its crews from 1795, which is where the nickname limeys came from.

  - id: med-011
    difficulty: 2
    prompt: Which blood vessels carry blood away from the heart?
    answer: Arteries
    distractors: [Veins, Capillaries, Venules]
    fact: The pulmonary artery is the exception people argue about. It runs from the heart to the lungs carrying blood that is low in oxygen.

  - id: med-012
    difficulty: 3
    prompt: Which Hungarian physician showed in the 1840s that handwashing cut deaths in maternity wards?
    answer: Ignaz Semmelweis
    distractors: [Joseph Lister, Louis Pasteur, Robert Koch]
    fact: His colleagues rejected the finding and he died in an asylum in 1865. Lister's antisepsis arrived two decades later and was accepted.

  - id: med-013
    difficulty: 3
    prompt: Which organ produces bile?
    answer: The liver
    distractors: [The gallbladder, The pancreas, The spleen]
    fact: The gallbladder only stores and concentrates it. Remove the gallbladder and the liver carries on supplying bile directly.

  - id: med-014
    difficulty: 3
    prompt: Who developed the first successful polio vaccine, licensed in 1955?
    answer: Jonas Salk
    distractors: [Albert Sabin, Thomas Francis, Hilary Koprowski]
    fact: Salk's was an injected killed-virus vaccine. Sabin's oral live vaccine followed in 1961 and became the one used worldwide.

  - id: med-015
    difficulty: 3
    prompt: In which country was the first successful human heart transplant performed, in 1967?
    answer: South Africa
    distractors: [The United States, The Soviet Union, France]
    fact: Christiaan Barnard operated at Groote Schuur Hospital in Cape Town. The patient, Louis Washkansky, lived 18 days.

  - id: med-016
    difficulty: 3
    prompt: Which protein in the blood carries oxygen?
    answer: Haemoglobin
    distractors: [Albumin, Fibrinogen, Myoglobin]
    fact: Myoglobin does the same job in muscle tissue, and it is what makes red meat red.

  - id: med-017
    difficulty: 3
    prompt: Which instrument did Rene Laennec invent in 1816?
    answer: The stethoscope
    distractors: [The thermometer, The syringe, The otoscope]
    fact: His first was a rolled paper tube. He devised it partly to avoid putting his ear directly against a patient's chest.

  - id: med-018
    difficulty: 3
    prompt: Which gland is often called the body's master gland?
    answer: The pituitary
    distractors: [The thyroid, The adrenal, The thymus]
    fact: It sits beneath the brain and directs the thyroid, the adrenals and the gonads by hormone, which is why the others answer to it.

  - id: med-019
    difficulty: 3
    prompt: Which disease was declared eradicated worldwide in 1980?
    answer: Smallpox
    distractors: [Polio, Measles, Diphtheria]
    fact: The last natural case was in Somalia in 1977. It remains the only human disease ever eradicated.

  - id: med-020
    difficulty: 4
    prompt: Which Austrian physician identified the ABO blood groups in 1901?
    answer: Karl Landsteiner
    distractors: [Paul Ehrlich, Emil von Behring, Alexander Wiener]
    fact: He took the 1930 Nobel for it. Before his work a transfusion was a gamble. He later co-discovered the Rh factor with Wiener.

  - id: med-021
    difficulty: 4
    prompt: Which bone of the inner ear is also known as the anvil?
    answer: The incus
    distractors: [The malleus, The stapes, The cochlea]
    fact: Malleus, incus and stapes are hammer, anvil and stirrup. The stapes is the smallest bone in the human body.

  - id: med-022
    difficulty: 4
    prompt: Which researcher isolated insulin with Charles Best in 1921?
    answer: Frederick Banting
    distractors: [John Macleod, James Collip, Nicolae Paulescu]
    fact: Banting shared the 1923 Nobel with Macleod and split his share with Best. Paulescu had published closely related work earlier that same year.

  - id: med-023
    difficulty: 4
    prompt: Robert Koch won the 1905 Nobel for identifying the bacterium causing which disease?
    answer: Tuberculosis
    distractors: [Cholera, Anthrax, Typhoid]
    fact: Koch identified the anthrax and cholera bacilli too, which is what makes the other answers reasonable guesses.

  - id: med-024
    difficulty: 4
    prompt: Which English physician first correctly described the circulation of the blood, in 1628?
    answer: William Harvey
    distractors: [Thomas Sydenham, Andreas Vesalius, Ambroise Pare]
    fact: He showed the heart pumps blood around a closed circuit, overturning Galen's account which had stood for some 1,400 years.

  - id: med-025
    difficulty: 4
    prompt: Which anaesthetic was first publicly demonstrated at Massachusetts General Hospital in 1846?
    answer: Ether
    distractors: [Chloroform, Nitrous oxide, Cocaine]
    fact: The operating theater there is still called the Ether Dome. Chloroform followed in Edinburgh the next year.
