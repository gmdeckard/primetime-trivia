category: film-tv
audience: 55-75

questions:
  - id: ftv-001
    difficulty: 2
    prompt: Which 1942 film ends at an airport in Morocco?
    answer: Casablanca
    distractors: [To Have and Have Not, The Maltese Falcon, Algiers]
    fact: The famous closing line was written late in production; the ending was not settled when shooting began.

  - id: ftv-002
    difficulty: 3
    prompt: Which film won the first Academy Award for Best Picture?
    answer: Wings
    distractors: [The Jazz Singer, Sunrise, The Broadway Melody]
    fact: Wings, a silent First World War aviation picture, won for 1927-28. It remains the only silent film to win Best Picture until The Artist in 2011.

  - id: ftv-003
    difficulty: 2
    prompt: Who directed "Psycho", "Vertigo" and "Rear Window"?
    answer: Alfred Hitchcock
    distractors: [Billy Wilder, John Huston, Orson Welles]
    fact: He was nominated five times for Best Director and never won.

  - id: ftv-004
    difficulty: 1
    prompt: Which actor played Michael Corleone in "The Godfather"?
    answer: Al Pacino
    distractors: [Robert De Niro, James Caan, John Cazale]
    fact: De Niro played the young Vito in Part II, winning an Oscar for a role Brando had already won one for.

  - id: ftv-005
    difficulty: 3
    prompt: Which television western ran from 1955 to 1975, the longest-running prime-time drama of its era?
    answer: Gunsmoke
    distractors: [Bonanza, Wagon Train, The Virginian]
    fact: Twenty seasons and 635 episodes. James Arness played Matt Dillon in every one.

