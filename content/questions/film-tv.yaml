    difficulty: 4
    prompt: Which film is widely credited with inventing the "deep focus" look in 1941?
    answer: Citizen Kane
    distractors: [The Grapes of Wrath, How Green Was My Valley, Rebecca]
    fact: Gregg Toland's cinematography was so central that Welles shared his title card with him.

