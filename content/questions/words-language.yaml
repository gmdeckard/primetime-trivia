category: words-language

questions:
  - id: wrd-001
    difficulty: 3
    prompt: What is the only English word that is its own opposite in common use, meaning both to split and to stick together?
    answer: Cleave
    distractors: [Rend, Bind, Sunder]
    fact: Such words are called contronyms. "Sanction" and "table" are others.

  - id: wrd-002
    difficulty: 2
    prompt: What does the Latin phrase "caveat emptor" mean?
    answer: Let the buyer beware
    distractors: [Let the seller beware, Buyer of last resort, The buyer decides]
    fact: It survives in commercial law as the principle that a buyer is responsible for inspecting goods.

  - id: wrd-003
    difficulty: 3
    prompt: Which language contributed the word "assassin" to English?
    answer: Arabic
    distractors: [Latin, Persian, Turkish]
    fact: It derives from hashishiyyin, a name applied to a medieval sect, and reached English via Italian and French.

  - id: wrd-004
    difficulty: 2
    prompt: What is a group of crows called?
    answer: A murder
    distractors: [A parliament, A charm, A gaggle]
    fact: A parliament is owls, a charm is finches and a gaggle is geese on the ground.

  - id: wrd-005
    difficulty: 4
    prompt: What is the term for a word formed from the initial letters of a phrase and pronounced as a word?
    answer: An acronym
    distractors: [An initialism, A portmanteau, A neologism]
    fact: NATO is an acronym; FBI is an initialism, because you say the letters.

  - id: wrd-006
    difficulty: 3
    prompt: What does the word "quarantine" originally refer to?
    answer: Forty days
    distractors: [Four weeks, A sealed ship, A plague house]
    fact: From the Venetian quaranta giorni — the period arriving ships were held before docking.

  - id: wrd-007
    difficulty: 2
    prompt: Which word describes a sentence that reads the same backwards?
    answer: A palindrome
    distractors: [An anagram, A lipogram, A pangram]
    fact: A pangram uses every letter of the alphabet, and a lipogram deliberately omits one.

  - id: wrd-008
    difficulty: 4
    prompt: What is the longest word in common English usage with all its letters in alphabetical order?
    answer: Almost
    distractors: [Billowy, Chintz, Abhors]
    fact: Six letters, a to t. "Billowy" is a seven-letter answer sometimes given, but it is less common in ordinary use.

  - id: wrd-009
    difficulty: 3
    prompt: The word "robot" entered English from which language?
    answer: Czech
    distractors: [Russian, German, Polish]
    fact: Karel Capek used it in his 1920 play R.U.R., from a word meaning forced labour.

  - id: wrd-010
    difficulty: 2
    prompt: What is a portmanteau word?
    answer: A word blending two others
    distractors: [A borrowed foreign word, A word with a silent letter, A word that imitates a sound]
    fact: Lewis Carroll coined the usage. "Brunch" and "smog" are examples.

  - id: wrd-011
    difficulty: 3
    prompt: What does "sic" indicate when it appears in brackets in a quotation?
    answer: The error is in the original
    distractors: [The text has been shortened, The emphasis is added, The source is uncertain]
    fact: From the Latin for "thus". It tells the reader the mistake is not the quoter's.

  - id: wrd-012
    difficulty: 4
    prompt: What is the study of place names called?
    answer: Toponymy
    distractors: [Etymology, Onomastics, Philology]
    fact: Onomastics is the broader study of names of all kinds, of which toponymy is a branch.

  - id: wrd-013
    difficulty: 2
    prompt: What does the prefix "penta-" mean?
    answer: Five
    distractors: [Four, Six, Ten]
    fact: From Greek. The Pentagon has five sides and the pentathlon five events.

  - id: wrd-014
    difficulty: 3
    prompt: Which punctuation mark is also called an interrobang?
    answer: A combined question mark and exclamation point
    distractors: [A semicolon, An em dash, An ellipsis]
    fact: An advertising executive proposed it in 1962. It never quite caught on.

  - id: wrd-015
    difficulty: 2
    prompt: What is the meaning of the idiom "to steal a march"?
    answer: To gain an advantage by acting before someone else
    distractors: [To take credit for another's work, To leave without paying, To copy a rival's method]
    fact: It is military in origin — moving troops while the enemy expected you to be camped.

  - id: wrd-016
    difficulty: 4
    prompt: Which English word comes from the Greek for "fear of the marketplace"?
    answer: Agoraphobia
    distractors: [Claustrophobia, Xenophobia, Acrophobia]
    fact: The agora was the public square of a Greek city.

  - id: wrd-017
    difficulty: 3
    prompt: What does the word "decimate" literally mean?
    answer: To reduce by one tenth
    distractors: [To destroy utterly, To reduce by nine tenths, To divide in half]
    fact: It was a Roman punishment in which one man in ten was executed. The modern loose sense has largely won.

  - id: wrd-018
    difficulty: 2
    prompt: Which word means a word that sounds like the thing it describes?
    answer: Onomatopoeia
    distractors: [Alliteration, Assonance, Synecdoche]
    fact: Buzz, hiss and clang are examples.

  - id: wrd-019
    difficulty: 4
    prompt: What is the plural of "octopus" preferred by most dictionaries?
    answer: Octopuses
    distractors: [Octopi, Octopodes, Octopus]
    fact: The word is Greek, not Latin, so "octopi" applies a Latin rule to a Greek word. "Octopodes" is defensible but rare.

  - id: wrd-020
    difficulty: 3
    prompt: The phrase "the whole nine yards" is of uncertain origin, but which explanation is NOT supported by evidence?
    answer: The length of a machine gun ammunition belt
    distractors: [A measure of cloth for a suit, The capacity of a cement mixer, Nobody knows]
    fact: The ammunition belt story is popular and unsupported. The phrase is not attested before the 1950s.

  - id: wrd-021
    difficulty: 2
    prompt: What does "bona fide" mean?
    answer: In good faith
    distractors: [Well made, Of good family, By good fortune]
    fact: Its opposite, mala fide, is much rarer in English.

  - id: wrd-022
    difficulty: 3
    prompt: Which word originally meant a small shield, and now means a protective barrier?
    answer: Escutcheon
    distractors: [Bulwark, Rampart, Aegis]
    fact: An escutcheon is the shield shape on a coat of arms; "a blot on the escutcheon" means a stain on one's honour.

  - id: wrd-023
    difficulty: 4
    prompt: What is a "hapax legomenon"?
    answer: A word appearing only once in a body of text
    distractors: [A word with no rhyme, A word borrowed unchanged, A word of disputed meaning]
    fact: They are a particular problem in ancient texts, where a single occurrence gives no context to work from.

  - id: wrd-024
    difficulty: 2
    prompt: What does the suffix "-ology" mean?
    answer: The study of
    distractors: [The love of, The fear of, The making of]
    fact: From the Greek logos. "-philia" is love of and "-phobia" fear of.

  - id: wrd-025
    difficulty: 3
    prompt: Which American lexicographer published a dictionary in 1828 that reformed US spelling?
    answer: Noah Webster
    distractors: [Samuel Johnson, James Murray, Joseph Worcester]
    fact: He dropped the u from colour and reversed the re in centre, among many other changes.

  - id: wrd-026
    difficulty: 4
    prompt: What is the term for the dot over a lower-case i or j?
    answer: A tittle
    distractors: [A serif, A diacritic, A cedilla]
    fact: It survives in the phrase "to a jot and tittle" — meaning to the smallest detail.

  - id: wrd-027
    difficulty: 2
    prompt: What is a "tautology"?
    answer: Saying the same thing twice in different words
    distractors: [A deliberate contradiction, An understatement, A rhetorical question]
    fact: '"Free gift" and "advance planning" are everyday examples.'

  - id: wrd-028
    difficulty: 3
    prompt: Which language has given English the words "typhoon", "ketchup" and "tea"?
    answer: Chinese
    distractors: [Japanese, Malay, Hindi]
    fact: All three arrived through trade, mostly via southern Chinese dialects and then Dutch or Portuguese.

  - id: wrd-029
    difficulty: 2
    prompt: What does the abbreviation "e.g." stand for?
    answer: Exempli gratia
    distractors: [Id est, Et cetera, Ergo]
    fact: It means "for example". "i.e." is id est, meaning "that is" — the two are constantly confused.

  - id: wrd-030
    difficulty: 4
    prompt: Which word describes the use of a part to stand for the whole, as in "all hands on deck"?
    answer: Synecdoche
    distractors: [Metonymy, Simile, Hyperbole]
    fact: Metonymy is the closely related device of substituting an associated thing, as in "the crown" for the monarchy.
