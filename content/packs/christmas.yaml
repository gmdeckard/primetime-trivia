  - id: xmas-001
    category: xmas-history
    difficulty: 3
    prompt: What city merged with New York City on New Year's Day 1898 to form the City of New York?
    answer: Brooklyn
    distractors:
      - Yonkers
      - Jersey City
      - Newark
    fact: Brooklyn was the fourth-largest city in the country on its last day as a city. The same merger took in Queens, Staten Island and the Bronx.
    tags:
      - new-york
      - new-year

  - id: xmas-002
