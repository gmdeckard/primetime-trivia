# The Christmas Deck
#
# Transcribed from a physical card game: 'Tis The Season Christmas Trivia,
# sixteen cards scanned front and back (christmas/c1.pdf, c2.pdf, c3.pdf).
# Six questions a card, one per category, and the six categories are the ones
# printed on the box — the star, candy cane, tree, log, candle and ornament
# that run down the left edge of every card, in that order.
#
# The cards were written for a human reading them aloud and judging the
# answer. This is four buttons on a phone, so the deck is not a literal
# transcription: every binary card ("six or eighteen?") gained two more
# options, every answer gained three distractors, and a handful of prompts
# were rewritten to stand on their own. Eight cards were cut outright.
# Every rewrite and every cut is listed in docs/CHRISTMAS-DECK.md against the
# original card text, so any of them can be put back.
#
# Switch it on under Questions for a December theme night and switch the
# other sets off. Six categories, so set questions per round to 6: a round is
# then exactly one card.
pack:
  id: christmas
  name: The Christmas Deck
  audience: 35-75
  created: 2026-11-05
  origin: transcribed
  model: claude-opus-5 (Claude Code session)
  reviewedBy: transcribed from the printed cards; distractors written fresh — no second-model fact-check yet
  notes: >-
    88 questions from 96 printed cards, taken from 'Tis The Season Christmas
    Trivia, a boxed card game. Answers are the ones printed on the back of each
    card except where docs/CHRISTMAS-DECK.md records otherwise.

